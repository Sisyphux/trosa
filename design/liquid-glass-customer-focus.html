<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客户 · 温润 Liquid Glass</title>
  <style>
    :root { --ink:#29251f; --sub:rgba(41,37,31,.66); --quiet:rgba(41,37,31,.42); --canvas:#f1eee6; --moss:#66705a; --clay:#a85f45; --mist:#647b82; --line:rgba(74,63,48,.13); --glass:rgba(255,253,247,.32); --glass-strong:rgba(255,253,247,.62); --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif; }
    * { box-sizing:border-box; } body { min-width:320px; margin:0; color:var(--ink); font-family:var(--sans); background:var(--canvas); } .scene { position:fixed; inset:0; z-index:-1; overflow:hidden; background:linear-gradient(142deg,#f2efe7 0%,#eee9de 46%,#e7ede6 100%); } .orb { position:absolute; border-radius:50%; filter:blur(20px); opacity:.78; } .orb.a { width:47vw; height:47vw; top:-27vw; left:-14vw; background:radial-gradient(circle at 68% 67%,rgba(203,151,122,.66) 0,rgba(234,216,195,.55) 34%,transparent 69%); } .orb.b { width:55vw; height:55vw; right:-27vw; bottom:-31vw; background:radial-gradient(circle at 28% 25%,rgba(145,171,159,.52) 0,rgba(205,225,216,.42) 33%,transparent 70%); } .orb.c { width:31vw; height:31vw; top:22%; left:35%; background:radial-gradient(circle,rgba(217,191,132,.3),transparent 67%); }
    main { width:min(880px,calc(100% - 36px)); margin:auto; padding:54px 0 74px; } header { display:flex; align-items:center; justify-content:space-between; min-height:52px; margin:0 4px 24px; } h1 { margin:0; font-size:28px; font-weight:620; letter-spacing:-.045em; } .toolbar { display:flex; align-items:center; gap:5px; padding:5px; border:1px solid rgba(255,255,255,.82); border-radius:17px; background:rgba(255,253,247,.35); box-shadow:0 9px 25px rgba(74,62,43,.08),inset 0 1px 0 rgba(255,255,255,.82),inset 0 -1px 0 rgba(102,93,75,.08); backdrop-filter:blur(24px) saturate(1.1); -webkit-backdrop-filter:blur(24px) saturate(1.1); } .toolbar button { width:34px; height:34px; display:grid; place-items:center; border:0; border-radius:12px; background:transparent; color:rgba(41,37,31,.66); } .toolbar button:first-child { background:rgba(255,255,255,.55); box-shadow:inset 0 1px 0 rgba(255,255,255,.92),0 2px 5px rgba(72,59,39,.08); } .toolbar svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; }
    .list { position:relative; overflow:hidden; padding:9px; border:1px solid rgba(255,255,255,.82); border-radius:28px; background:rgba(255,253,247,.23); box-shadow:0 24px 60px rgba(70,57,38,.11),inset 0 1px 0 rgba(255,255,255,.84),inset 0 -1px 0 rgba(87,73,52,.08); backdrop-filter:blur(26px) saturate(1.08); -webkit-backdrop-filter:blur(26px) saturate(1.08); } .list::before { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(122deg,rgba(255,255,255,.39),transparent 25%,rgba(255,255,255,.04) 62%,rgba(196,218,208,.13)); }
    .row { position:relative; display:grid; grid-template-columns:35px minmax(0,1fr) 86px 108px 28px; gap:13px; align-items:center; min-height:76px; padding:0 14px; border-radius:20px; will-change:transform,opacity; transition:opacity 340ms ease,filter 340ms ease,background 340ms ease,box-shadow 420ms cubic-bezier(.22,.85,.25,1),border-color 420ms ease; } .row + .row { margin-top:2px; } .row.active { border:1px solid rgba(255,255,255,.92); background:var(--glass-strong); box-shadow:inset 0 1px 0 rgba(255,255,255,.96),inset 0 -1px 0 rgba(109,97,76,.09),0 10px 24px rgba(74,63,44,.09); } .row.active::before { content:""; position:absolute; inset:0; z-index:0; overflow:hidden; border-radius:inherit; pointer-events:none; background:linear-gradient(124deg,rgba(255,255,255,.54),transparent 28%,rgba(255,255,255,.04) 58%,rgba(198,220,207,.18)); } .row.active::after { content:""; position:absolute; inset:-1px; z-index:0; border-radius:inherit; pointer-events:none; opacity:0; background:linear-gradient(110deg,transparent 26%,rgba(255,255,255,.76) 46%,transparent 65%); transform:translateX(-80%); } .row.active.fresh::after { animation:materialSweep 650ms cubic-bezier(.15,.8,.2,1) both; } @keyframes materialSweep { 0% { opacity:0; transform:translateX(-80%); } 22% { opacity:.72; } 100% { opacity:0; transform:translateX(88%); } } .row.active + .row:not(.active) { margin-top:16px; } .row.normal { opacity:.55; filter:saturate(.62); } .row.normal:hover { opacity:.84; filter:saturate(.84); background:rgba(255,253,247,.16); }
    .focus-control { position:relative; z-index:1; width:29px; height:29px; padding:0; border:0; border-radius:50%; cursor:pointer; background:rgba(255,255,255,.26); box-shadow:inset 0 1px 1px rgba(255,255,255,.76),0 2px 6px rgba(67,57,42,.1); } .focus-control::before { content:""; position:absolute; inset:1px; border:1px solid rgba(255,255,255,.72); border-radius:50%; background:radial-gradient(circle at 32% 23%,rgba(255,255,255,.98),rgba(222,221,207,.58) 43%,rgba(155,160,145,.44)); transition:transform 420ms cubic-bezier(.16,.9,.25,1),background 360ms ease,box-shadow 420ms ease; } .focus-control::after { content:""; position:absolute; top:11px; left:11px; width:7px; height:7px; border-radius:3px; background:rgba(79,84,74,.5); transform:rotate(45deg); transition:background 310ms ease,box-shadow 380ms ease,transform 420ms cubic-bezier(.16,.9,.25,1); } .focus-control:focus-visible { outline:2px solid var(--moss); outline-offset:3px; } .active .focus-control { background:rgba(255,255,255,.43); box-shadow:inset 0 1px 1px #fff,0 0 10px rgba(214,215,170,.68),0 0 22px rgba(141,166,137,.3); } .active .focus-control::before { background:radial-gradient(circle at 31% 22%,#fffef8,#eef1d8 37%,#b8caa2 73%,#82957a); box-shadow:inset 0 1px 2px #fff,0 0 7px rgba(232,243,209,.88); } .active .focus-control::after { background:#fffbe1; box-shadow:0 0 4px 2px rgba(255,255,240,.96),0 0 10px 4px rgba(202,213,151,.7); } .focus-control:hover::before { transform:scale(1.07); } .focus-control.pressing { animation:press 430ms cubic-bezier(.16,.9,.25,1); } @keyframes press { 0% { transform:scale(1); } 26% { transform:scale(.78); } 58% { transform:scale(1.09); } 100% { transform:scale(1); } }
    .main-copy,.value,.grip { position:relative; z-index:1; } .main-copy { min-width:0; } .main-copy strong { display:block; overflow:hidden; font-size:15px; font-weight:610; letter-spacing:-.012em; text-overflow:ellipsis; white-space:nowrap; } .main-copy span { display:block; margin-top:5px; overflow:hidden; color:var(--sub); font-size:12px; text-overflow:ellipsis; white-space:nowrap; } .value { color:var(--sub); font-size:12px; white-space:nowrap; } .value.time { color:var(--quiet); font-variant-numeric:tabular-nums; } .active .main-copy strong { color:#27271f; } .active .value { color:rgba(48,47,38,.65); }
    .grip { width:27px; height:31px; display:grid; grid-template-columns:repeat(2,3px); grid-template-rows:repeat(3,3px); gap:3px; align-content:center; justify-content:center; border:0; border-radius:10px; background:transparent; color:rgba(83,78,65,.45); cursor:grab; touch-action:none; } .grip i { width:3px; height:3px; border-radius:50%; background:currentColor; } .grip:hover { color:var(--moss); background:rgba(222,231,211,.42); } .normal .grip { visibility:hidden; } .row.dragging { opacity:.24; pointer-events:none; } .row.over { background:rgba(240,246,232,.58); box-shadow:inset 0 0 0 1px rgba(102,126,91,.42),0 8px 17px rgba(78,96,69,.1); }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:1ms!important; transition-duration:1ms!important; } } @media (max-width:650px) { main { width:min(100% - 24px,880px); padding-top:31px; } .list { overflow:auto; } .row { grid-template-columns:35px minmax(220px,1fr) 80px 104px 28px; min-width:570px; } }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"><i class="orb a"></i><i class="orb b"></i><i class="orb c"></i></div>
  <main><header><h1>客户</h1><nav class="toolbar" aria-label="客户视图"><button aria-label="列表视图"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button><button aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg></button></nav></header><section class="list" aria-label="客户列表"><div id="rows"></div></section></main>
  <script>
    const customers=[
      {id:1,name:'Acryl Innovations GmbH',detail:'确认样品反馈与下一轮报价',country:'德国',next:'今天',active:true},
      {id:2,name:'Kanso Living',detail:'发送更新后的目录与起订量',country:'日本',next:'今天',active:true},
      {id:3,name:'Atelier Noma',detail:'等待秋季系列内部评审',country:'法国',next:'明天',active:false},
      {id:4,name:'Forma Studio',detail:'整理定制色板与会议时间',country:'意大利',next:'7 月 29 日',active:false},
      {id:5,name:'North & Pine',detail:'补充首单包装条款',country:'美国',next:'7 月 30 日',active:false},
      {id:6,name:'Woolf & Oak',detail:'确认新系列材料样本',country:'英国',next:'尚未安排',active:false}
    ]; let activeOrder=[1,2], dragging=null; const root=document.getElementById('rows'); const dots='<i></i><i></i><i></i><i></i><i></i><i></i>';
    function get(id){return customers.find(c=>c.id===id)} function ordered(){return [...activeOrder.map(get),...customers.filter(c=>!c.active)]} function positions(){return new Map([...root.querySelectorAll('.row')].map(row=>[+row.dataset.id,row.getBoundingClientRect().top]))}
    function animateMove(before){requestAnimationFrame(()=>{root.querySelectorAll('.row').forEach(row=>{const oldTop=before.get(+row.dataset.id);if(oldTop===undefined)return;const delta=oldTop-row.getBoundingClientRect().top;if(!delta)return;row.style.transition='none';row.style.transform=`translateY(${delta}px)`;requestAnimationFrame(()=>{row.style.transition='transform 620ms cubic-bezier(.22,.9,.26,1)';row.style.transform='';setTimeout(()=>{row.style.transition=''},660)})})})}
    function render(fresh,before){root.innerHTML=ordered().map(c=>`<article class="row ${c.active?'active':'normal'} ${fresh===c.id?'fresh':''}" data-id="${c.id}"><button class="focus-control" type="button" aria-label="${c.active?'取消标记':'标记'} ${c.name}" aria-pressed="${c.active}"></button><div class="main-copy"><strong>${c.name}</strong><span>${c.detail}</span></div><div class="value">${c.country}</div><div class="value time">${c.next}</div><button class="grip" type="button" ${c.active?'':'tabindex="-1" aria-hidden="true"'}>${dots}</button></article>`).join('');root.querySelectorAll('.focus-control').forEach(button=>button.addEventListener('click',()=>{button.classList.add('pressing');setTimeout(()=>toggle(+button.closest('.row').dataset.id),130)}));root.querySelectorAll('.row.active').forEach(row=>{row.draggable=true;row.addEventListener('dragstart',()=>{dragging=+row.dataset.id;row.classList.add('dragging')});row.addEventListener('dragend',()=>{dragging=null;root.querySelectorAll('.row').forEach(x=>x.classList.remove('dragging','over'))});row.addEventListener('dragover',e=>{e.preventDefault();if(dragging!==+row.dataset.id)row.classList.add('over')});row.addEventListener('dragleave',()=>row.classList.remove('over'));row.addEventListener('drop',e=>{e.preventDefault();const target=+row.dataset.id;if(!dragging||target===dragging)return;const before=positions(),from=activeOrder.indexOf(dragging),to=activeOrder.indexOf(target);activeOrder.splice(from,1);activeOrder.splice(to,0,dragging);render(null,before)})});if(before)animateMove(before)}
    function toggle(id){const before=positions(),c=get(id);c.active=!c.active;if(c.active)activeOrder.unshift(id);else activeOrder=activeOrder.filter(x=>x!==id);render(c.active?id:null,before)} render();
  </script>
</body>
</html>
