<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trosa — Workspace 03 · Dial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101317; --panel:#151A1F; --bone:#E7E5DF; --ink-2:#B9BFC4; --dim:#828B93; --faint:#5C646C;
  --moss:#7A9C87; --amber:#C08A55; --line:rgba(231,229,223,.10); --line-2:rgba(231,229,223,.22);
  --sans:"DM Sans","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"DM Mono","SFMono-Regular",Menlo,monospace;
  --gut:clamp(1.2rem,2.8vw,2.6rem);
  --ease:cubic-bezier(.16,1,.3,1); --ease-out:cubic-bezier(.2,.85,.15,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-weight:400;background:var(--bg);color:var(--bone);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.tnum{font-variant-numeric:tabular-nums}
.lbl{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
:focus-visible{outline:1px solid var(--amber);outline-offset:3px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto}
.top{display:flex;align-items:center;gap:1.2rem;height:clamp(46px,5.6vh,58px);padding:0 var(--gut);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:500;font-size:.94rem;letter-spacing:.02em}
.brand i{width:8px;height:8px;border-radius:50%;border:1px solid var(--amber)}
.top .meta{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;color:var(--faint)}
.nav{margin-left:auto;display:flex;gap:1.15rem}
.nav button{font-size:.74rem;letter-spacing:.05em;padding:.2rem 0;color:var(--dim);border-bottom:1px solid transparent;transition:color .25s,border-color .25s}
.nav button:hover{color:var(--bone)}
.nav button.on{color:var(--bone);border-color:var(--amber)}
.who{display:flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;color:var(--ink-2)}
.who i{width:6px;height:6px;border-radius:50%;background:var(--moss)}

.mid{display:grid;grid-template-columns:minmax(340px,43fr) minmax(340px,57fr);overflow:hidden}
.dialcol{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(.6rem,1.6vh,1.4rem);
  padding:clamp(1rem,2.6vh,2rem) var(--gut);border-right:1px solid var(--line);overflow:hidden}
.dialcol::before{content:'';position:absolute;left:50%;top:44%;width:min(56vh,440px);aspect-ratio:1;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(192,138,85,.07),transparent 62%);pointer-events:none}
.dial{position:relative;width:min(40vh,360px);aspect-ratio:1}
svg{width:100%;height:100%;display:block;overflow:visible}
.dring{fill:none;stroke:var(--line);stroke-width:1}
.darc{fill:none;stroke:var(--moss);stroke-width:1.5;opacity:.85}
.dtick{stroke:rgba(231,229,223,.24);stroke-width:1}
.dtick.major{stroke:rgba(231,229,223,.44)}
.ddot{fill:var(--dim)}
.ddot.today{fill:var(--amber)}
.ddot.next{fill:none;stroke:var(--amber);stroke-width:1.4}
.dhand{stroke:var(--amber);stroke-width:1.2}
.dtip{fill:var(--amber)}
.dlbl{fill:var(--dim);font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.ddate{fill:var(--bone);font-family:var(--mono);font-size:40px;font-weight:500;letter-spacing:-.02em}
.dsub{fill:var(--dim);font-family:var(--mono);font-size:9.5px;letter-spacing:.14em}
body.js .dring{stroke-dasharray:1100;stroke-dashoffset:1100}
body.in .dring{stroke-dashoffset:0;transition:stroke-dashoffset 1.4s var(--ease-out) .1s}
body.js .darc{stroke-dasharray:520;stroke-dashoffset:520}
body.in .darc{stroke-dashoffset:0;transition:stroke-dashoffset 1.2s var(--ease-out) .5s}
body.js .dtick,body.js .ddot{opacity:0}
body.in .dtick,body.in .ddot{opacity:1;transition:opacity .5s var(--ease)}
body.js .dhand{transform:rotate(150deg);transform-origin:200px 200px;transform-box:view-box}
body.in .dhand{transform:rotate(var(--rot,320deg));transition:transform 1.5s var(--ease-out) .2s}
body.js .dcenter{opacity:0}
body.in .dcenter{opacity:1;transition:opacity .8s var(--ease) .9s}

.nx{width:100%;max-width:420px;text-align:center}
.nx h2{margin-top:.5rem;font-weight:400;font-size:clamp(1.05rem,1.6vw,1.35rem);line-height:1.3}
.nx .d{margin-top:.35rem;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;color:var(--amber)}
.nx .acts{display:flex;gap:.5rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.nx .acts button{padding:.48rem 1rem;border:1px solid var(--line-2);border-radius:999px;font-size:.72rem;color:var(--ink-2);transition:border-color .25s,color .25s,background .25s}
.nx .acts button:hover{color:var(--bone);border-color:var(--bone)}
.nx .acts button.primary{background:var(--amber);border-color:var(--amber);color:#17130E}
.nx .acts button.primary:hover{background:#D09A63;border-color:#D09A63}
.waitline{width:100%;max-width:420px;display:flex;align-items:baseline;gap:.7rem;justify-content:center;padding-top:clamp(.7rem,1.8vh,1.2rem);border-top:1px solid var(--line)}
.waitline .lbl{color:var(--faint)}
.waitline p{font-size:.82rem;color:var(--ink-2)}

.pane{display:flex;flex-direction:column;padding:clamp(1rem,2.6vh,2rem) var(--gut);min-width:0}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding-bottom:.7rem;border-bottom:1px solid var(--line-2)}
.phead .lbl{color:var(--bone)}
.phead .lbl+.lbl{color:var(--dim)}
.pbody{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.drec{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:1.1rem;padding:clamp(.7rem,1.7vh,1.15rem) 0;border-bottom:1px solid var(--line);flex:1 1 0;min-height:0;align-content:start}
.drec .dd{font-family:var(--mono);font-size:.78rem;color:var(--ink-2)}
.drec .dd i{display:block;font-style:normal;font-size:.6rem;letter-spacing:.1em;color:var(--faint);margin-top:.3rem}
.drec p{font-size:.94rem;line-height:1.5;color:var(--ink-2)}
.drec em{display:block;margin-top:.35rem;font-style:normal;font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;color:var(--moss)}
.drec:hover p{color:var(--bone)}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:clamp(.7rem,1.7vh,1.1rem) 0;border-bottom:1px solid var(--line)}
.prow b{font-weight:500;font-size:.92rem}
.prow .sm{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--dim);margin-top:.25rem}
.prow a{font-family:var(--mono);font-size:.68rem;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-2);white-space:nowrap}
.prow time{font-family:var(--mono);font-size:.68rem;color:var(--dim);white-space:nowrap}
.prow.done b{color:var(--faint);text-decoration:line-through}
.dlg{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:0 1.2rem;padding-top:.4rem}
.dlg dt{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:.42rem 0}
.dlg dd{font-size:.88rem;color:var(--ink-2);padding:.42rem 0;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bot{display:flex;align-items:center;gap:1.4rem;min-width:0;min-height:clamp(66px,8vh,84px);padding:.8rem clamp(7rem,9vw,8.5rem) .8rem var(--gut);border-top:1px solid var(--line);background:var(--panel)}
.ticker{min-width:0;flex:1}
.ticker blockquote{margin-top:.3rem;font-size:.86rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticker cite{font-style:normal;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;color:var(--faint);margin-left:.6rem}
.stats{display:flex;gap:clamp(1rem,2.6vw,2.4rem);flex-shrink:0}
.stat b{display:block;font-family:var(--mono);font-size:1.15rem;font-weight:500;color:var(--bone)}
.stat span{display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:.15rem}

/* intro */
.intro{position:fixed;inset:0;z-index:80;background:var(--bg)}
.intro.gone{opacity:0;pointer-events:none;transition:opacity .7s var(--ease)}
.ifields{position:absolute;inset:0;display:flex}
.ifield{position:relative;flex:1 1 0;min-width:0;background:var(--t);display:flex;align-items:flex-end;padding:0 clamp(1.2rem,2.4vw,2.2rem) clamp(2.4rem,5vw,3.6rem);transition:flex-grow .7s var(--ease-out),opacity .5s var(--ease)}
.ifield.active{flex-grow:2.4}
.ifield.drained{flex-grow:0;opacity:0}
.ifield .spine{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:clamp(.75rem,1vw,.9rem);letter-spacing:.34em;text-transform:uppercase;color:rgba(16,19,23,.66);white-space:nowrap}
.ifield.active .spine{opacity:0}
.ibrand{position:absolute;top:clamp(1rem,2.4vw,1.6rem);left:clamp(1.2rem,2.4vw,2.2rem);font-family:var(--mono);font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:#101317}
.veil{position:fixed;inset:0;z-index:81;opacity:0;pointer-events:none;background:linear-gradient(90deg,#D9D0C3,#CCB7AB,#BEC6B8,#BCC3C8);transition:opacity .5s var(--ease),background .9s var(--ease)}
.veil.on{opacity:1}
.veil.washed{background:var(--bg)!important}
.veil .rings i{position:absolute;left:50%;top:44%;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
  border:1px solid rgba(231,229,223,.3);border-radius:50%;opacity:0;transform:scale(1.45);transition:transform 1.1s var(--ease-out),opacity .9s var(--ease)}
.veil.washed .rings i{opacity:.5;transform:scale(.62)}
.veil.washed .rings i:nth-child(1){transition-delay:.02s}
.veil.washed .rings i:nth-child(2){transition-delay:.10s}
.veil.washed .rings i:nth-child(3){transition-delay:.18s}
.veil .vname{position:absolute;left:clamp(1.2rem,2.4vw,2.2rem);bottom:clamp(2.2rem,4.6vw,3.4rem);font-family:var(--mono);font-size:clamp(1.3rem,3.6vw,2.4rem);letter-spacing:.06em;text-transform:uppercase;color:#101317;transition:opacity .5s var(--ease),transform .7s var(--ease-out)}
.veil.washed .vname{opacity:0;transform:translateY(-.5rem)}

body.js .fade{opacity:0}
body.in .fade{opacity:1;transition:opacity .9s var(--ease)}
body.in .dialcol.fade{transition-delay:.75s}
body.in .pane.fade{transition-delay:.9s}
body.in .bot.fade{transition-delay:1.02s}
.replay{position:fixed;z-index:50;bottom:.9rem;right:.9rem;font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);background:rgba(16,19,23,.8);backdrop-filter:blur(6px);padding:.42rem .85rem;opacity:0;transition:opacity .5s var(--ease) .6s}
body.in .replay{opacity:1}

@media (max-width:1024px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .pbody{flex:none;display:block}
  .drec{flex:none}
  .mid{grid-template-columns:1fr;grid-template-rows:auto auto}
  .dialcol{border-right:0;border-bottom:1px solid var(--line);padding-bottom:1.6rem}
  .dial{width:min(70vw,320px)}
  .bot{flex-wrap:wrap;padding-right:var(--gut)}
  .stats{width:100%;justify-content:space-between;flex-wrap:wrap}
  .ticker{width:100%}
  .ticker blockquote{white-space:normal}
}
@media (max-width:560px){
  .nav{display:none}
  .who{margin-left:auto}
  .top .meta{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
  body.js .dring{stroke-dashoffset:0!important}
  body.js .darc{stroke-dashoffset:0!important}
  body.js .dtick,body.js .ddot,body.js .dcenter{opacity:1!important}
  body.js .dhand{transform:rotate(var(--rot,320deg))!important}
  body.js .fade{opacity:1!important}
}
</style>
</head>

</div>

<button class="replay" id="replay">重播转场</button>

<script>
document.documentElement.classList.add('js');document.body.classList.add('js');

var DATA={customer:{
  company:'Acryl Innovations GmbH',no:'014',country:'德国',industry:'展示器材 / 亚克力',
  source:'SIGN CHINA 2026 · 展会',level:'B+',website:'acryl-innovations.de',businessRole:'终端',
  profile:'杜塞尔多夫零售陈列供应商，为连锁品牌定制亚克力陈列件。在测试我们的再生料系列，关注再生比例与欧盟合规文件。',

  contacts:[{name:'Markus Weber',title:'采购经理',email:'m.weber@acryl-innovations.de',primary:true},
            {name:'Lena Fischer',title:'产品与合规',email:'l.fischer@acryl-innovations.de'}],
  facts:[
    {date:'2026-09-24',type:'邮件',dir:'in',source:'客户来信',full:'Markus 回复：三款色板的耐候测试通过，但需要我们在报价中标注再生料比例与 EU 合规编号。',result:'需补充材料说明'},

    {date:'2026-09-18',type:'展会现场',dir:'two',source:'SIGN CHINA 2026',full:'展位沟通 25 分钟，对方对再生亚克力系列感兴趣，现场索要样品与 MOQ。',result:'约定寄样并报价'},
    {date:'2026-09-16',type:'报价',dir:'out',source:'首轮报价 RP-0916',full:'发出首轮报价，MOQ 500 件，交期 25 天。'},
    {date:'2026-09-10',type:'开发邮件',dir:'out',source:'开发信',full:'通过领英找到采购负责人，发出首封开发邮件。'}
  ],
  files:[{name:'报价单_RP-0916.pdf',cat:'报价单',size:'218 KB',date:'2026-09-16'},
         {name:'色板参数表_R-PMMA.xlsx',cat:'产品资料',size:'64 KB',date:'2026-09-22'},
         {name:'SIGN_CHINA_展位记录.jpg',cat:'展会资料',size:'1.2 MB',date:'2026-09-18'}],
  tasks:[{title:'确认样品反馈，准备下一轮报价',date:'2026-09-29',done:false,next:true},
         {title:'补发 EU 合规文件（REACH / ROHS）',date:'2026-10-02',done:false},
         {title:'寄出手感样并确认收货',date:'2026-09-22',done:true}]
}};
function cn(iso){var p=iso.split('-');return Number(p[1])+' 月 '+Number(p[2])+' 日';}
function md(iso){var p=iso.split('-');return p[1]+'/'+p[2];}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- dial ---------- */
(function dial(){
  var NS='http://www.w3.org/2000/svg',CX=200,CY=200;
  var start=new Date('2026-09-01T00:00:00'),end=new Date('2026-10-01T00:00:00'),span=end-start;
  function ang(iso){return ((new Date(iso+'T00:00:00')-start)/span)*360-90;}
  function pt(a,r){var rad=a*Math.PI/180;return [CX+Math.cos(rad)*r,CY+Math.sin(rad)*r];}
  var tl=document.getElementById('dticks'),dots=document.getElementById('ddots');
  var t='',dd='';
  for(var i=0;i<30;i++){
    var a=ang(new Date(start.getTime()+i*864e5).toISOString().slice(0,10));
    var major=(i%5===0);
    var p1=pt(a,major?152:156),p2=pt(a,166);
    t+='<line class="dtick'+(major?' major':'')+'" x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'" style="transition-delay:'+(i*14)+'ms"></line>';
  }
  tl.innerHTML=t;
  DATA.customer.facts.forEach(function(f,i){
    var p=pt(ang(f.date),180);
    dd+='<circle class="ddot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" style="transition-delay:'+(360+i*60)+'ms"></circle>';
  });
  var pt1=pt(ang('2026-09-27'),180);
  dd+='<circle class="ddot today" cx="'+pt1[0].toFixed(1)+'" cy="'+pt1[1].toFixed(1)+'" r="4.5" style="transition-delay:700ms"></circle>';
  var pn=pt(ang('2026-09-29'),180);
  dd+='<circle class="ddot next" cx="'+pn[0].toFixed(1)+'" cy="'+pn[1].toFixed(1)+'" r="5.5" style="transition-delay:760ms"></circle>';
  dots.innerHTML=dd;
  /* elapsed arc: 09/10 → 09/27 */
  var a1=ang('2026-09-10'),a2=ang('2026-09-27'),r=168;
  var s=pt(a1,r),e=pt(a2,r),large=(a2-a1)>180?1:0;
  document.getElementById('darc').setAttribute('d','M '+s[0].toFixed(1)+' '+s[1].toFixed(1)+' A '+r+' '+r+' 0 '+large+' 1 '+e[0].toFixed(1)+' '+e[1].toFixed(1));
  document.querySelector('.dhand').style.setProperty('--rot',(ang('2026-09-29')+90)+'deg');
})();

  timeline:{t:'沟通与时间线',render:function(c){return {meta:c.facts.length+' 条记录',html:c.facts.map(function(f){

           (f.result?'<em>结果 — '+esc(f.result)+'</em>':'<em style="color:var(--faint)">'+esc(dt)+'</em>')+'</div></div>';
  }).join('')};}},
  profile:{t:'资料',render:function(c){return {meta:'客户身份',html:'<dl class="dlg">'+

     ['等级',esc(c.level)],['业务角色',esc(c.businessRole)],['网站','<a href="https://'+esc(c.website)+'" target="_blank" rel="noopener">'+esc(c.website)+'</a>'],
     ['当前等待',esc(c.waiting)],['简介',esc(c.profile)]].map(function(r){return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>';}).join('')+'</dl>'};}},
  contacts:{t:'联系人',render:function(c){return {meta:c.contacts.length+' 位',html:c.contacts.map(function(p){

};
function show(key){
  var c=DATA.customer,p=PANEL[key],d=p.render(c);
  document.getElementById('pTitle').textContent=p.t;
  document.getElementById('pMeta').textContent=d.meta;
  document.getElementById('pBody').innerHTML=d.html;
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===key);});
}
document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.dataset.v);});
document.getElementById('logBtn').addEventListener('click',function(){show('timeline');});
document.addEventListener('keydown',function(e){
  var map={'1':'timeline','2':'profile','3':'contacts','4':'files','5':'tasks','0':'timeline'};
  if(map[e.key])show(map[e.key]);
});
show('timeline');

/* intro: Colonnade → Dial (tones drain inward, rings converge) */
(function(){
  var intro=document.getElementById('intro'),veil=document.getElementById('veil'),vname=document.getElementById('vname');
  var ifields=[].slice.call(document.querySelectorAll('.ifield'));
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var timers=[];function tm(fn,ms){timers.push(setTimeout(fn,ms));}function clr(){timers.forEach(clearTimeout);timers=[];}
  function pick(el){ifields.forEach(function(f){f.classList.toggle('active',f===el);});}
  function play(name,el){
    clr();
    document.body.classList.remove('in');
    intro.classList.remove('gone');veil.classList.remove('on','washed');
    ifields.forEach(function(f){f.style.display='';f.classList.remove('active','drained');});
    vname.textContent=name;document.getElementById('whoUser').textContent=name;
    if(reduce){enter(name);return;}
    pick(el);
    tm(function(){
      ifields.forEach(function(f){if(f!==el)f.classList.add('drained');});
      veil.classList.add('on');
      tm(function(){veil.classList.add('washed');},560);
      tm(function(){document.body.classList.add('in');},560+560);
      tm(function(){intro.classList.add('gone');},560+560+760);
    },300);
  }
  function enter(name){
    clr();veil.classList.remove('on');ifields.forEach(function(f){f.style.display='none';});
    document.getElementById('whoUser').textContent=name;
    document.body.classList.add('in');intro.classList.add('gone');
  }
  var chosen=0,interacted=false;
  ifields.forEach(function(f,i){
    f.addEventListener('mouseenter',function(){interacted=true;pick(f);});
    f.addEventListener('focus',function(){interacted=true;pick(f);});
    f.addEventListener('click',function(){interacted=true;chosen=i;play(f.dataset.name,f);});
  });
  setTimeout(function(){if(!interacted){chosen=0;play('Amy',ifields[0]);}},900);
  document.getElementById('replay').addEventListener('click',function(){intro.classList.remove('gone');play(ifields[chosen].dataset.name,ifields[chosen]);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!intro.classList.contains('gone')){enter('Amy');}});
})();
</script>
