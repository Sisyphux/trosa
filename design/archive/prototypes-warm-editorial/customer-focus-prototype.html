<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade OS · 客户关注排序原型</title>
  <style>
    :root { --canvas:#ece7dc; --paper:#fbf8f1; --ink:#29251f; --soft:#696257; --quiet:#9c9589; --line:rgba(66,55,41,.14); --glass:rgba(255,254,248,.62); --brass:#b38448; --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif; --serif:"Songti SC","STSong",Georgia,serif; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; color:var(--ink); font-family:var(--sans); background:radial-gradient(circle at 12% 10%,rgba(166,180,156,.27),transparent 28rem),radial-gradient(circle at 91% 7%,rgba(218,173,133,.24),transparent 25rem),var(--canvas); }
    main { width:min(1010px,calc(100% - 40px)); margin:auto; padding:58px 0 80px; } header { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:34px; } .eyebrow { color:#63705d; font-size:11px; font-weight:700; letter-spacing:.12em; } h1 { margin:9px 0 0; font:500 clamp(32px,4.5vw,48px)/1.08 var(--serif); letter-spacing:-.045em; } .subtitle { margin:12px 0 0; color:var(--soft); font-size:14px; }
    .legend { display:flex; gap:16px; align-items:center; padding:9px 0; color:var(--quiet); font-size:11px; white-space:nowrap; } .legend i { display:inline-block; width:9px; height:9px; margin-right:6px; border-radius:50%; vertical-align:-1px; background:#f5e4ae; box-shadow:0 0 5px 1px #fff2bd,0 0 13px 4px rgba(180,129,59,.35); } .legend em { display:inline-block; width:11px; height:11px; margin-right:6px; border:1px solid rgba(83,82,73,.35); border-radius:50%; vertical-align:-1px; background:rgba(130,131,120,.25); }
    .table { overflow:hidden; border:1px solid rgba(255,255,255,.8); border-radius:24px; background:rgba(251,248,241,.76); box-shadow:0 22px 55px rgba(76,60,39,.12),inset 0 1px 0 rgba(255,255,255,.9); backdrop-filter:blur(14px); } .table-head { display:grid; grid-template-columns:minmax(260px,2fr) .75fr .9fr .9fr 32px; gap:18px; align-items:center; min-height:50px; padding:0 24px; border-bottom:1px solid var(--line); color:var(--quiet); font-size:11px; letter-spacing:.06em; }
    .rows { padding:10px 10px 12px; } .row { position:relative; display:grid; grid-template-columns:minmax(260px,2fr) .75fr .9fr .9fr 32px; gap:18px; align-items:center; min-height:76px; padding:0 14px; border-bottom:1px solid var(--line); transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .35s ease,filter .35s ease,background .35s ease,box-shadow .35s ease; } .row:last-child { border-bottom:0; }
    .row.focus { z-index:1; margin:3px 0; border:1px solid rgba(255,255,255,.82); border-radius:15px; background:linear-gradient(105deg,rgba(246,241,217,.76),rgba(249,251,243,.67) 58%,rgba(224,235,226,.53)); box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 9px 20px rgba(89,80,56,.08); } .row.focus::before { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:linear-gradient(120deg,rgba(255,255,255,.5),transparent 28%,rgba(255,255,255,.05) 62%,rgba(197,216,200,.2)); } .row.focus + .row:not(.focus) { margin-top:18px; border-top:1px solid rgba(66,55,41,.18); }
    .row.normal { opacity:.58; filter:saturate(.65); } .row.normal:hover { opacity:.86; filter:saturate(.85); background:rgba(255,253,247,.36); } .row.transitioning { animation:arrive .52s cubic-bezier(.18,.9,.25,1); } @keyframes arrive { 0% { transform:scale(.98); } 55% { transform:scale(1.012); } 100% { transform:scale(1); } }
    .company { position:relative; z-index:1; display:flex; align-items:center; min-width:0; gap:11px; } .company-copy { min-width:0; } .company strong { display:block; overflow:hidden; font-size:14px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; } .company span { display:block; margin-top:5px; overflow:hidden; color:var(--soft); font-size:11px; text-overflow:ellipsis; white-space:nowrap; } .cell { position:relative; z-index:1; color:var(--soft); font-size:12px; } .cell.time { color:var(--quiet); font-variant-numeric:tabular-nums; }
    .marker { position:relative; flex:0 0 auto; width:28px; height:28px; padding:0; border:0; border-radius:50%; background:transparent; cursor:pointer; } .marker:focus-visible { outline:2px solid var(--brass); outline-offset:3px; } .marker::before { content:""; position:absolute; inset:4px; border:1px solid rgba(86,84,74,.34); border-radius:50%; background:radial-gradient(circle at 31% 24%,rgba(255,255,255,.95),rgba(199,203,194,.59) 42%,rgba(126,132,121,.48)); box-shadow:inset 0 1px 2px rgba(255,255,255,.88),0 1px 2px rgba(56,53,44,.12); transition:all .38s cubic-bezier(.2,.8,.2,1); } .marker::after { content:""; position:absolute; inset:12px; border-radius:50%; background:rgba(78,83,75,.7); box-shadow:inset 0 1px 1px rgba(255,255,255,.6); transition:all .32s ease; }
    .focus .marker::before { border-color:rgba(168,124,56,.7); background:radial-gradient(circle at 30% 24%,#fffef5,#f3dfaa 44%,#c69a55); box-shadow:inset 0 1px 4px rgba(255,255,255,.98),0 0 7px 1px rgba(255,238,164,.82),0 0 18px 4px rgba(190,142,61,.35); } .focus .marker::after { background:#fff5c4; box-shadow:0 0 5px 2px rgba(255,248,195,.98),0 0 13px 5px rgba(227,181,91,.56); } .marker:hover::before { transform:scale(1.09); } .marker.pressing { animation:press .42s cubic-bezier(.2,.9,.25,1); } @keyframes press { 0% { transform:scale(1); } 28% { transform:scale(.78); } 62% { transform:scale(1.1); } 100% { transform:scale(1); } }
    .grip { position:relative; z-index:1; width:26px; height:32px; display:grid; grid-template-columns:repeat(2,3px); grid-template-rows:repeat(3,3px); gap:3px; align-content:center; justify-content:center; border:0; border-radius:8px; background:transparent; color:#918978; cursor:grab; touch-action:none; } .grip i { width:3px; height:3px; border-radius:50%; background:currentColor; } .grip:hover { color:#8d642b; background:rgba(220,185,114,.13); } .normal .grip { visibility:hidden; } .row.dragging { opacity:.28; pointer-events:none; } .row.over { border-color:rgba(177,130,55,.58); background:rgba(250,241,207,.66); box-shadow:inset 0 0 0 1px rgba(187,140,59,.24); }
    @media (max-width:700px) { main { width:min(100% - 28px,1010px); padding-top:34px; } header { display:block; } .legend { margin-top:18px; } .table { overflow:auto; } .table-head,.row { grid-template-columns:minmax(250px,1.7fr) 100px 110px 90px 32px; min-width:650px; } }
  </style>
</head>
<body>
  <main>
    <header><div><div class="eyebrow">TRADE OS · CUSTOMER LIST STUDY</div><h1>客户</h1><p class="subtitle">点击左侧标记；已关注客户自动置顶，并可用六点手柄调整顺序。</p></div><div class="legend"><span><i></i> 已关注</span><span><em></em> 普通</span></div></header>
    <section class="table" aria-label="客户列表"><div class="table-head"><span>客户</span><span>国家</span><span>最近发生</span><span>下一步</span><span></span></div><div class="rows" id="rows"></div></section>
  </main>
  <script>
    const data=[
      {id:1,name:'Acryl Innovations GmbH',sub:'确认样品反馈与下一轮报价',country:'德国',recent:'7 月 26 日',next:'今天',focus:true},
      {id:2,name:'Kanso Living',sub:'发送更新后的目录与起订量',country:'日本',recent:'7 月 24 日',next:'今天',focus:true},
      {id:3,name:'Atelier Noma',sub:'等待秋季系列内部评审',country:'法国',recent:'7 月 23 日',next:'明天',focus:false},
      {id:4,name:'Forma Studio',sub:'整理定制色板与会议时间',country:'意大利',recent:'7 月 20 日',next:'7 月 29 日',focus:false},
      {id:5,name:'North & Pine',sub:'补充首单包装条款',country:'美国',recent:'7 月 18 日',next:'7 月 30 日',focus:false},
      {id:6,name:'Woolf & Oak',sub:'确认新系列的材料样本',country:'英国',recent:'7 月 16 日',next:'尚未安排',focus:false}
    ]; let focusOrder=[1,2], dragging=null;
    const rows=document.getElementById('rows');
    const grip='<i></i><i></i><i></i><i></i><i></i><i></i>';
    function sorted(){return [...focusOrder.map(id=>data.find(x=>x.id===id)),...data.filter(x=>!x.focus)]}
    function draw(arrive){rows.innerHTML=sorted().map(c=>`<article class="row ${c.focus?'focus':'normal'} ${arrive===c.id?'transitioning':''}" data-id="${c.id}"><div class="company"><button class="marker" type="button" aria-label="${c.focus?'取消关注':'添加关注'} ${c.name}" aria-pressed="${c.focus}"></button><div class="company-copy"><strong>${c.name}</strong><span>${c.sub}</span></div></div><div class="cell">${c.country}</div><div class="cell time">${c.recent}</div><div class="cell time">${c.next}</div><button class="grip" type="button" ${c.focus?'':'tabindex="-1" aria-hidden="true"'}>${grip}</button></article>`).join('');rows.querySelectorAll('.marker').forEach(b=>b.addEventListener('click',()=>{b.classList.add('pressing');setTimeout(()=>toggle(+b.closest('.row').dataset.id),120)}));rows.querySelectorAll('.row.focus').forEach(row=>{row.draggable=true;row.addEventListener('dragstart',()=>{dragging=+row.dataset.id;row.classList.add('dragging')});row.addEventListener('dragend',()=>{dragging=null;rows.querySelectorAll('.row').forEach(x=>x.classList.remove('dragging','over'))});row.addEventListener('dragover',e=>{e.preventDefault();if(dragging!==+row.dataset.id)row.classList.add('over')});row.addEventListener('dragleave',()=>row.classList.remove('over'));row.addEventListener('drop',e=>{e.preventDefault();const target=+row.dataset.id;if(!dragging||dragging===target)return;const from=focusOrder.indexOf(dragging),to=focusOrder.indexOf(target);focusOrder.splice(from,1);focusOrder.splice(to,0,dragging);draw()})})}
    function toggle(id){const item=data.find(x=>x.id===id);item.focus=!item.focus;if(item.focus)focusOrder.unshift(id);else focusOrder=focusOrder.filter(x=>x!==id);draw(item.focus?id:null)} draw();
  </script>
</body>
</html>
