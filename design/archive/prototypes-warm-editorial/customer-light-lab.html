<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade OS · 客户提醒玻璃卡片</title>
  <style>
    :root { --ink:#29251f; --soft:#625d55; --muted:#8a8377; --paper:#f6f1e7; --line:rgba(67,57,43,.15); --amber:#e2a850; --amber-deep:#a96528; --glass:rgba(255,253,247,.54); --glass-strong:rgba(255,252,243,.72); --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif; --serif:"Songti SC","STSong",Georgia,serif; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; color:var(--ink); font-family:var(--sans); background:#e8e1d4; }
    body::before { content:""; position:fixed; inset:0; z-index:-2; background:radial-gradient(circle at 8% 15%,#d2dbc6 0,transparent 25%),radial-gradient(circle at 87% 8%,#edc8a9 0,transparent 27%),radial-gradient(circle at 77% 91%,#bbcfd0 0,transparent 28%),linear-gradient(135deg,#ece5d9,#e5ddd0); }
    body::after { content:""; position:fixed; inset:0; z-index:-1; opacity:.3; background-image:url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E"); pointer-events:none; }
    button { font:inherit; color:inherit; } main { width:min(1160px,calc(100% - 40px)); margin:auto; padding:54px 0 72px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:28px; margin-bottom:38px; } .eyebrow { color:#52614c; font-size:11px; font-weight:700; letter-spacing:.12em; } h1 { margin:10px 0 0; font:500 clamp(34px,5vw,54px)/1.02 var(--serif); letter-spacing:-.05em; } .intro { max-width:500px; margin:14px 0 0; color:var(--soft); font-size:14px; line-height:1.7; }
    .glass { position:relative; isolation:isolate; overflow:hidden; border:1px solid rgba(255,255,255,.8); background:var(--glass); box-shadow:0 18px 50px rgba(74,59,39,.13),inset 0 1px 0 rgba(255,255,255,.78),inset 0 -1px 0 rgba(126,104,73,.09); backdrop-filter:blur(24px) saturate(1.28); -webkit-backdrop-filter:blur(24px) saturate(1.28); }
    .glass::before { content:""; position:absolute; z-index:-1; inset:0; pointer-events:none; background:linear-gradient(125deg,rgba(255,255,255,.58),transparent 24%,rgba(255,255,255,.05) 58%,rgba(218,238,231,.2)); }
    .legend { min-width:220px; padding:14px 16px; border-radius:18px; color:var(--soft); font-size:12px; line-height:1.55; } .legend b { display:block; color:var(--ink); font-size:13px; font-weight:650; } .legend i { display:inline-block; width:8px; height:8px; margin-right:7px; border-radius:50%; background:#fff2b2; box-shadow:0 0 6px 2px #fff0a3,0 0 16px 5px rgba(231,172,72,.6); }
    .workspace { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr); gap:26px; align-items:start; } .section-title { display:flex; align-items:center; justify-content:space-between; gap:14px; margin:0 0 12px; color:var(--soft); font-size:12px; font-weight:650; letter-spacing:.04em; } .section-title span { color:var(--muted); font-weight:500; }
    .customer-list { padding:9px 14px 14px; border-radius:25px; background:rgba(255,253,248,.52); border:1px solid rgba(255,255,255,.65); box-shadow:0 10px 30px rgba(76,60,40,.05); } .customer { position:relative; display:grid; grid-template-columns:38px minmax(0,1fr) auto; align-items:center; gap:12px; min-height:78px; padding:10px 9px; border-bottom:1px solid var(--line); } .customer:last-child { border:0; } .customer strong { display:block; font-size:14px; font-weight:650; } .customer small { display:block; margin-top:5px; color:var(--soft); font-size:12px; } .customer time { color:var(--muted); font-size:11px; white-space:nowrap; }
    .activate { position:relative; width:32px; height:32px; border:0; border-radius:50%; padding:0; cursor:pointer; background:transparent; } .activate:focus-visible { outline:2px solid var(--amber-deep); outline-offset:3px; } .activate::before { content:""; position:absolute; inset:4px; border:1px solid rgba(84,81,68,.34); border-radius:50%; background:radial-gradient(circle at 31% 24%,rgba(255,255,255,.98),rgba(220,220,208,.62) 42%,rgba(143,147,133,.45)); box-shadow:inset 0 1px 3px rgba(255,255,255,.9),0 2px 5px rgba(50,48,38,.16); transition:all .4s cubic-bezier(.18,.8,.22,1); } .activate::after { content:""; position:absolute; inset:13px; border-radius:50%; background:#6b6d64; box-shadow:inset 0 1px 1px rgba(255,255,255,.7); transition:all .35s ease; } .customer.active .activate::before { border-color:rgba(202,148,60,.72); background:radial-gradient(circle at 30% 24%,#fffef7,#f8e9aa 44%,#d7ac61); box-shadow:inset 0 1px 4px #fff,0 0 9px 2px rgba(255,240,165,.92),0 0 25px 7px rgba(229,171,75,.45); } .customer.active .activate::after { background:#fff7c7; box-shadow:0 0 7px 3px #fff7bd,0 0 17px 7px rgba(239,185,83,.8); } .activate:hover::before { transform:scale(1.1); }
    .notification-wrap { overflow:hidden; max-height:0; opacity:0; transition:max-height .58s cubic-bezier(.2,.8,.2,1),opacity .32s ease,margin .45s ease; } .customer.active .notification-wrap { max-height:150px; opacity:1; margin:0 0 9px; }
    .notification { display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:10px; align-items:center; min-height:72px; margin:0 0 0 47px; padding:11px 12px; border-radius:17px; background:var(--glass-strong); transform:translateY(-14px) scale(.97); transition:transform .52s cubic-bezier(.16,.9,.24,1); } .customer.active .notification { transform:translateY(0) scale(1); } .notification::after { content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; background:radial-gradient(circle at 9% 50%,rgba(255,225,132,.45),transparent 30%),linear-gradient(110deg,rgba(255,255,255,.22),transparent 55%); } .notification-icon { width:28px; height:28px; display:grid; place-items:center; border-radius:10px; background:rgba(255,247,204,.55); color:var(--amber-deep); box-shadow:inset 0 1px 1px rgba(255,255,255,.9); } .notification-icon svg { width:15px; height:15px; } .notification b { display:block; font-size:12px; font-weight:700; } .notification span { display:block; margin-top:4px; color:var(--soft); font-size:11px; } .notification button { min-height:29px; border:1px solid rgba(159,111,46,.28); border-radius:9px; background:rgba(255,255,255,.34); color:#86531f; cursor:pointer; font-size:11px; }
    .queue-panel { position:sticky; top:24px; border-radius:26px; padding:6px; } .queue-panel::after { content:""; position:absolute; z-index:-2; width:170px; height:170px; top:-72px; right:-58px; border-radius:50%; background:rgba(231,176,100,.42); filter:blur(30px); } .queue-head { display:flex; justify-content:space-between; align-items:center; padding:17px 16px 14px; border-bottom:1px solid rgba(83,71,52,.15); } .queue-head h2 { margin:0; font-size:15px; font-weight:650; } .queue-head span { color:var(--muted); font-size:11px; } .queue-items { min-height:324px; padding:4px 10px 10px; } .empty { display:grid; min-height:292px; place-items:center; color:var(--muted); font-size:12px; line-height:1.7; text-align:center; } .queue-item { display:grid; grid-template-columns:24px minmax(0,1fr) 25px; gap:7px; align-items:center; min-height:66px; border-bottom:1px solid rgba(83,71,52,.12); cursor:grab; user-select:none; } .queue-item:last-child { border:0; } .queue-item.dragging { opacity:.3; } .queue-item.over { border-radius:12px; background:rgba(255,247,208,.38); box-shadow:inset 0 0 0 1px rgba(187,132,48,.23); } .grip { width:20px; display:grid; grid-template-columns:repeat(2,3px); grid-template-rows:repeat(3,3px); gap:3px; justify-content:center; } .grip i { width:3px; height:3px; border-radius:50%; background:#989182; } .queue-copy b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; font-weight:650; } .queue-copy span { display:block; margin-top:4px; color:var(--soft); font-size:10px; } .rank { color:#9a682e; font-size:11px; text-align:right; font-variant-numeric:tabular-nums; } .queue-foot { padding:13px 16px 16px; border-top:1px solid rgba(83,71,52,.15); color:var(--soft); font-size:11px; line-height:1.6; }
    @keyframes liquidPress { 0% { transform:scale(1); } 24% { transform:scale(.82); } 56% { transform:scale(1.13); } 100% { transform:scale(1); } } .customer.activating .activate { animation:liquidPress .52s cubic-bezier(.16,.9,.25,1); }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:1ms!important; transition-duration:1ms!important; } } @media (max-width:780px) { main { width:min(100% - 28px,1160px); padding-top:34px; } header { display:block; } .legend { margin-top:20px; } .workspace { grid-template-columns:1fr; } .queue-panel { position:relative; top:auto; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">TRADE OS · GLASS REMINDER STUDY</div><h1>客户提醒，浮在工作之上。</h1><p class="intro">列表负责阅读，提醒以可展开的液态玻璃卡片承接注意力。点亮客户后，提醒卡片出现，并进入右侧的今日推进顺序。</p></div>
      <aside class="glass legend"><b><i></i> 今天需要推进</b>玻璃卡片是临时操作层；客户资料仍保持稳定、可扫读的内容层。</aside>
    </header>
    <section class="workspace">
      <section><div class="section-title">全部客户 <span>点按圆形玻璃控制件，显示提醒卡片</span></div><div class="customer-list" id="customers"></div></section>
      <aside class="glass queue-panel"><div class="queue-head"><h2>今日推进</h2><span id="count">0 位客户</span></div><div class="queue-items" id="queue"></div><div class="queue-foot">拖动六点手柄调整顺序。此处是固定的工作队列；退出提醒后，客户会回到普通列表状态。</div></aside>
    </section>
  </main>
  <script>
    const people = [
      {id:1,name:'Acryl Innovations GmbH',meta:'德国 · 确认样品反馈与报价窗口',date:'今天',on:true},
      {id:2,name:'Atelier Noma',meta:'法国 · 等待秋季系列内部评审',date:'明天',on:false},
      {id:3,name:'Kanso Living',meta:'日本 · 发送目录与起订量说明',date:'今天',on:true},
      {id:4,name:'Forma Studio',meta:'意大利 · 整理定制色板',date:'7 月 29 日',on:false},
      {id:5,name:'North & Pine',meta:'美国 · 补充首单包装条款',date:'7 月 30 日',on:false}
    ];
    let order=[1,3], dragging=null;
    const list=document.getElementById('customers'), queue=document.getElementById('queue'), count=document.getElementById('count');
    const bell='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 22h4"/></svg>';
    function byId(id){return people.find(x=>x.id===id)}
    function draw(highlight){list.innerHTML=people.map(p=>`<article class="customer ${p.on?'active':''} ${highlight===p.id?'activating':''}" data-id="${p.id}"><button class="activate" aria-label="${p.on?'取消':'开启'} ${p.name} 的今日推进提醒" aria-pressed="${p.on}"></button><div><strong>${p.name}</strong><small>${p.meta}</small></div><time>${p.date}</time><div class="notification-wrap"><div class="glass notification"><span class="notification-icon">${bell}</span><div><b>今天推进 · ${p.name}</b><span>${p.meta}</span></div><button type="button" data-off="${p.id}">完成提醒</button></div></div></article>`).join(''); list.querySelectorAll('.activate').forEach(b=>b.addEventListener('click',()=>toggle(+b.closest('.customer').dataset.id)));list.querySelectorAll('[data-off]').forEach(b=>b.addEventListener('click',()=>toggle(+b.dataset.off)));}
    function drawQueue(){const active=order.map(byId).filter(Boolean);count.textContent=`${active.length} 位客户`;if(!active.length){queue.innerHTML='<div class="empty">点亮客户后，提醒会以玻璃卡片出现，<br>并加入今天的推进队列。</div>';return;}queue.innerHTML=active.map((p,i)=>`<div class="queue-item" draggable="true" data-id="${p.id}"><span class="grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="queue-copy"><b>${p.name}</b><span>${p.meta}</span></span><span class="rank">${String(i+1).padStart(2,'0')}</span></div>`).join('');queue.querySelectorAll('.queue-item').forEach(row=>{row.addEventListener('dragstart',()=>{dragging=+row.dataset.id;row.classList.add('dragging')});row.addEventListener('dragend',()=>{dragging=null;queue.querySelectorAll('.queue-item').forEach(x=>x.classList.remove('dragging','over'))});row.addEventListener('dragover',e=>{e.preventDefault();if(dragging!==+row.dataset.id)row.classList.add('over')});row.addEventListener('dragleave',()=>row.classList.remove('over'));row.addEventListener('drop',e=>{e.preventDefault();const target=+row.dataset.id;if(!dragging||target===dragging)return;const a=order.indexOf(dragging),b=order.indexOf(target);order.splice(a,1);order.splice(b,0,dragging);drawQueue()})})}
    function toggle(id){const p=byId(id);p.on=!p.on;if(p.on&&!order.includes(id))order.push(id);if(!p.on)order=order.filter(x=>x!==id);draw(p.on?id:null);drawQueue()}
    draw();drawQueue();
  </script>
</body>
</html>
