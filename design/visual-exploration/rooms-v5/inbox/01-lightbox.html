<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trosa — Inbox 房间 A · 灯箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== 共用底座：token 取自 app/static/visual-v3.css :root（--dl-*），不新增色系/字体 ===== */
:root{
  --dl-hi:#faf8f2; --dl-canvas:#efeae0; --dl-canvas-low:#ded6c6;
  --dl-paper:#fffdf7; --dl-paper-2:#fbf8f1; --dl-paper-3:#f5f1e7;
  --dl-ink:#24221d; --dl-ink-2:#57534a; --dl-ink-3:#6f6a5f; --dl-mut:#8a8478; --dl-faint:#b7b1a4;
  --dl-gold:#bc9052; --dl-gold-ink:#8a6224; --dl-gold-soft:#f3e7d3; --dl-gold-wash:rgba(188,144,82,.10);
  --dl-danger:#a4443a; --dl-danger-soft:#f6e6e3; --dl-ok:#5c7a5a; --dl-ok-soft:#e7eee3;
  --dl-hair:rgba(36,34,29,.13); --dl-hair-2:rgba(36,34,29,.07); --dl-hair-strong:rgba(36,34,29,.26);
  --dl-ink-wash:rgba(36,34,29,.05);
  --dl-display:"Newsreader","Source Serif 4",Georgia,"Iowan Old Style","PingFang SC","Noto Sans SC Variable","Source Han Sans SC","Microsoft YaHei UI",system-ui,sans-serif;
  --dl-sans:"Inter","Noto Sans SC Variable","Source Han Sans SC","PingFang SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
  --dl-ease:cubic-bezier(.16,1,.3,1);
  --gut:clamp(1rem,3.2vw,2.6rem);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--dl-sans);font-size:14.25px;line-height:1.55;color:var(--dl-ink);background:var(--dl-canvas);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
.app{grid-template-columns:minmax(0,1fr)}
button{background:none;border:0;cursor:pointer;text-align:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.sr-only{position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.micro{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dl-ink-2)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--dl-gold-ink);outline-offset:2px;border-radius:4px}
kbd{font:500 .68rem/1 var(--dl-sans);font-variant-numeric:tabular-nums;display:inline-block;min-width:1.35em;padding:.22em .4em;margin-left:.5em;text-align:center;
  color:var(--dl-ink-3);border:1px solid var(--dl-hair-strong);border-radius:4px;background:transparent}
.solid kbd{color:#e9e3d5;border-color:rgba(255,253,247,.35)}

/* 唯一实心元素：当前信号最主要的处理动作 */
.solid{display:inline-flex;align-items:center;justify-content:center;gap:.2rem;min-height:40px;padding:.5rem 1.15rem;border-radius:999px;
  background:var(--dl-ink);color:#fffdf7;font-weight:500;font-size:.9rem;letter-spacing:.01em;transition:background .2s var(--dl-ease),transform .2s var(--dl-ease)}
.solid:hover{background:#3a372f}
.solid:active{transform:translateY(1px)}
.solid[disabled]{background:var(--dl-hair-strong);color:var(--dl-ink-2);cursor:not-allowed}
.text-btn{display:inline-flex;align-items:center;min-height:36px;padding:.35rem .7rem;border-radius:999px;color:var(--dl-ink-2);font-size:.86rem;
  border:1px solid transparent;transition:color .2s,background .2s,border-color .2s}
.text-btn:hover{color:var(--dl-ink);background:rgba(255,253,247,.85);border-color:var(--dl-hair)}
.text-btn[disabled]{color:var(--dl-ink-3);opacity:.6;cursor:not-allowed;background:none;border-color:transparent}

/* AI 标注：所有 AI 内容必须带这个标签 */
.ai-tag{display:inline-flex;align-items:center;height:1.35rem;padding:0 .5rem;border-radius:999px;border:1px solid var(--dl-gold);color:var(--dl-gold-ink);
  font-size:.7rem;font-weight:500;letter-spacing:.04em;background:var(--dl-gold-wash);white-space:nowrap;vertical-align:middle}
.conf{font-size:.76rem;color:var(--dl-ink-2);margin-left:.35rem}
.intent{font-size:.72rem;padding:.05rem .45rem;border-radius:999px;border:1px solid var(--dl-hair);color:var(--dl-ink-2)}
.intent-neg{color:var(--dl-danger);border-color:rgba(164,68,58,.4)}
mark.hot{background:none;color:var(--dl-ink);font-weight:600;box-shadow:inset 0 -.42em 0 var(--dl-gold-soft)}

/* 分析 / 证据 */
.an-h{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;font-size:.8rem;color:var(--dl-ink-2)}
.an-s{margin-top:.55rem;font-size:.95rem;line-height:1.6}
.an-f{margin-top:.6rem;display:flex;flex-wrap:wrap;gap:.35rem;list-style:none}
.an-f li{font-size:.8rem;padding:.18rem .6rem;border:1px solid var(--dl-hair);border-radius:999px;color:var(--dl-ink-2);background:var(--dl-paper-2)}
.an-n{margin-top:.55rem;font-size:.84rem;color:var(--dl-ink-2)}
.an-n span{display:inline-block;margin-right:.6rem;font-size:.72rem;letter-spacing:.1em;color:var(--dl-ink-3)}
.an-n em{display:block;font-style:normal;color:var(--dl-ink-3);font-size:.8rem;margin-top:.15rem}
.an-note{margin-top:.6rem;font-size:.82rem;color:var(--dl-ink-2);padding-left:.7rem;border-left:2px solid var(--dl-gold)}
.ev-i{margin-top:.6rem}
.ev-i figcaption{display:flex;justify-content:space-between;gap:1rem;font-size:.74rem;letter-spacing:.06em;color:var(--dl-ink-3)}
.ev-i blockquote{margin-top:.3rem;font-size:.92rem;line-height:1.65;color:var(--dl-ink)}

/* 表单（三个房间共用结构，各自改皮） */
.frm{display:flex;flex-direction:column;gap:.85rem}
.frm-row{display:flex;flex-direction:column;gap:.4rem}
.frm label,.frm-lab{font-size:.78rem;letter-spacing:.04em;color:var(--dl-ink-2);display:flex;align-items:center;gap:.5rem}
.req{font-size:.68rem;color:var(--dl-gold-ink);letter-spacing:.06em}
.frm-in{width:100%;padding:.55rem .75rem;border-radius:10px;border:1px solid var(--dl-hair-strong);background:var(--dl-paper);font-size:.92rem;line-height:1.5;resize:vertical}
.frm-in:focus-visible{outline:2px solid var(--dl-gold-ink);outline-offset:1px}
input[type=date].frm-in{width:auto;min-width:9.5rem}
.frm-date{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.frm-when{font-size:.84rem;color:var(--dl-ink-2)}
.frm-err{font-size:.8rem;color:var(--dl-danger)}
.frm-help{font-size:.8rem;color:var(--dl-ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{min-height:34px;padding:.3rem .8rem;border-radius:999px;border:1px solid var(--dl-hair-strong);font-size:.82rem;color:var(--dl-ink-2);background:transparent;transition:border-color .2s,background .2s,color .2s}
.chip:hover{border-color:var(--dl-ink-3);color:var(--dl-ink)}
.chip[aria-pressed=true],.chip[aria-checked=true]{border-color:var(--dl-ink);color:var(--dl-ink);background:var(--dl-paper);box-shadow:inset 0 0 0 1px var(--dl-ink)}
.chip .num{color:var(--dl-ink-3);font-size:.76rem}
.cands{display:flex;flex-direction:column;gap:.35rem}
.cand{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.1rem .8rem;padding:.6rem .8rem;border:1px solid var(--dl-hair);border-radius:10px;background:var(--dl-paper)}
.cand:hover{border-color:var(--dl-ink-3)}
.cand[aria-checked=true]{border-color:var(--dl-ink);box-shadow:inset 0 0 0 1px var(--dl-ink)}
.cand-n{font-weight:500;font-size:.9rem}
.cand-m{grid-column:1;font-size:.78rem;color:var(--dl-ink-3)}
.cand-s{grid-column:2;grid-row:1/3;align-self:center;font-size:.84rem;color:var(--dl-ink-2)}
.frm-fx{font-size:.8rem;color:var(--dl-ink-2);display:flex;flex-direction:column;gap:.25rem;padding:.6rem .75rem;border-radius:10px;background:var(--dl-ink-wash)}
.frm-fx b{font-weight:600;margin-right:.5rem;color:var(--dl-ink)}
.frm-act{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:10px 0 4px;background:var(--dl-paper);border-top:1px solid var(--dl-hair-2)}
.frm-next{display:flex;flex-direction:column;gap:.85rem;margin-top:.5rem;padding:.8rem;border:1px dashed var(--dl-hair-strong);border-radius:10px}
.frm-opt{align-items:flex-start}

/* 原型状态条：不属于产品，仅供切换加载/失败/空态 */
.statebar{position:fixed;z-index:90;right:var(--gut);bottom:8px;display:flex;align-items:center;gap:.15rem;padding:.2rem .35rem .2rem .7rem;
  border:1px dashed var(--dl-hair-strong);border-radius:999px;background:rgba(250,248,242,.92);max-width:calc(100vw - 16px);overflow:auto}
.statebar .micro{margin-right:.35rem;font-size:.62rem}
.statebar button{min-height:28px;padding:0 .6rem;border-radius:999px;font-size:.74rem;color:var(--dl-ink-2);white-space:nowrap}
.statebar button:hover{color:var(--dl-ink)}
.statebar button[aria-pressed=true]{color:var(--dl-ink);box-shadow:inset 0 0 0 1px var(--dl-ink)}

/* 骨架（加载态） */
.sk{position:relative;overflow:hidden;background:var(--dl-ink-wash);border-radius:6px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,253,247,.75),transparent);animation:sk 1.4s infinite}
@keyframes sk{to{transform:translateX(100%)}}
.banner{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.5rem .9rem;border:1px solid rgba(164,68,58,.4);background:var(--dl-danger-soft);border-radius:10px;font-size:.84rem;color:var(--dl-ink)}
.banner b{color:var(--dl-danger);font-weight:600}
.banner .text-btn{margin-left:auto;border-color:var(--dl-hair-strong)}

@media (max-width:760px){.statebar{right:auto;left:50%;transform:translateX(-50%)}}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
html.rm .sk::after{display:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .sk::after{display:none}
}


/* ==========================================================================
   房间 A · 灯箱
   空间：昏暗的房间里只有一块亮着的灯箱面板；底片排成一条，逐张放大到面板上。
   ========================================================================== */
body{background:linear-gradient(180deg,var(--dl-canvas) 0%,var(--dl-canvas-low) 100%);min-height:100vh}
.app{position:relative;height:100vh;height:100dvh;display:grid;grid-template-rows:52px minmax(0,1fr) 34px 150px 46px;overflow:hidden}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(70% 70% at 50% 40%,rgba(255,253,247,.0) 35%,rgba(36,34,29,.14) 100%)}
.app>*{position:relative;z-index:1}

/* 顶部：楼层 + 房间名 */
.top{display:flex;align-items:center;gap:1rem;padding:0 var(--gut);border-bottom:1px solid var(--dl-hair-2)}
.brand{font-family:var(--dl-display);font-size:1.05rem}
.top .where{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dl-ink-2)}
.top .count{margin-left:auto;font-size:.8rem;color:var(--dl-ink-2)}
.top .count b{font-family:var(--dl-display);font-weight:400;font-size:1.15rem;color:var(--dl-ink);margin-right:.2rem}
.who{display:flex;align-items:center;gap:.5rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dl-ink-2)}
.who i{width:6px;height:6px;border-radius:50%;background:var(--dl-gold);box-shadow:0 0 0 3px rgba(188,144,82,.16)}

/* 舞台：灯箱面板 */
.stage{position:relative;padding:14px var(--gut) 0;display:flex;flex-direction:column;min-height:0}
.stage::before{content:"";position:absolute;left:50%;top:44%;width:min(1500px,120%);height:120%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,253,247,.9),rgba(255,253,247,.55) 55%,rgba(255,253,247,0));filter:blur(8px)}
.banner{position:relative;max-width:1240px;width:100%;margin:0 auto 10px}
.panel{position:relative;flex:1;min-height:0;width:100%;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;
  background:var(--dl-paper);border:1px solid var(--dl-hair);border-radius:14px;overflow:hidden}
.panel.flash{animation:flash .5s var(--dl-ease)}
@keyframes flash{0%{filter:brightness(.94)}100%{filter:none}}
.ph{display:flex;gap:1.5rem;align-items:flex-start;padding:22px 30px 16px;border-bottom:1px solid var(--dl-hair-2)}
.ph-l{min-width:0;flex:1}
.kicker{display:flex;flex-wrap:wrap;gap:.35rem .8rem;align-items:center}
.kicker .pos{color:var(--dl-gold-ink);font-weight:600}
.kicker .rv{color:var(--dl-ink);border:1px dashed var(--dl-ink-3);padding:.05rem .5rem;border-radius:999px;font-size:.68rem;letter-spacing:.08em}
.ph h1{margin-top:.35rem;font-family:var(--dl-display);font-weight:400;font-size:clamp(1.6rem,2.7vw,2.3rem);line-height:1.12;letter-spacing:-.015em;overflow-wrap:anywhere}
.ph h1:focus-visible{outline:none}
.ph .sub{margin-top:.4rem;font-size:.84rem;color:var(--dl-ink-2);overflow-wrap:anywhere}
.ph .hd{flex:none;text-align:right;max-width:22ch}
.ph .hd p{font-family:var(--dl-display);font-size:1.02rem;line-height:1.3;color:var(--dl-ink)}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}
.c-src{padding:18px 30px 18px;overflow:auto;border-right:1px solid var(--dl-hair-2)}
.c-src h2{display:flex;align-items:center;justify-content:space-between;gap:1rem;font-weight:500}
.c-src h2 button{font-size:.72rem;letter-spacing:.06em;color:var(--dl-ink-2);padding:.1rem .55rem;border:1px solid var(--dl-hair-strong);border-radius:999px;text-transform:none}
.c-src h2 button[aria-pressed=false]{color:var(--dl-ink-3);border-style:dashed}
.c-src.dim mark.hot{font-weight:400;box-shadow:none}
.ev-i blockquote{font-size:1rem;line-height:1.7}
.c-src .tr{margin-top:.9rem;font-size:.78rem;color:var(--dl-ink-3)}
.c-ai{position:relative;display:flex;flex-direction:column;min-height:0;padding:18px 30px 18px}
.ana{position:absolute;right:22px;top:10px;min-height:30px;padding:.1rem .6rem;font-size:.78rem;z-index:2}
.ana[aria-pressed=true]{border-color:var(--dl-hair-strong)}
.ai-box .an-h{padding-right:7rem}
.ai-box{flex:1;min-height:0;overflow:auto;padding-right:2px}
.ai-box .an-s{font-size:1.02rem}
.an-next{margin-top:.8rem;padding:.65rem .8rem;border:1px dashed var(--dl-gold);border-radius:10px;background:var(--dl-gold-wash)}
.an-next span{display:block;font-size:.68rem;letter-spacing:.14em;color:var(--dl-gold-ink)}
.an-next p{margin-top:.15rem;font-size:.92rem}
.pv{margin-top:.7rem;display:flex;flex-direction:column;gap:.3rem}
.pv div{display:flex;justify-content:space-between;gap:1rem;padding:.45rem .7rem;border:1px solid var(--dl-hair);border-radius:9px;font-size:.86rem}
.pv em{font-style:normal;color:var(--dl-ink-3);font-size:.78rem}
.why{margin-top:.8rem;font-size:.82rem;color:var(--dl-ink-2)}
.why span{display:block;font-size:.68rem;letter-spacing:.14em;color:var(--dl-ink-3)}
.ai-box .known{margin-top:.6rem;font-size:.8rem;color:var(--dl-ink-3);list-style:none}
.work{flex:none;padding-top:14px;margin-top:10px;border-top:1px solid var(--dl-hair-2)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem}
.acts .sp{flex:1}
.acts .hint{flex-basis:100%;font-size:.8rem;color:var(--dl-ink-2);margin-bottom:.1rem}
.panel.forming .an-f,.panel.forming .an-n,.panel.forming .an-note,.panel.forming .an-next,.panel.forming .pv,.panel.forming .why,.panel.forming .known{display:none}
.panel.forming .an-s{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.panel.forming .work{border-top:0;margin-top:6px}
.panel.forming .c-ai{overflow:auto}
.panel.forming .ai-box{flex:none}
.frm-fx{background:var(--dl-paper-3)}

/* 投影：底片被光投到面板上 */
.cone{position:relative;pointer-events:none}
.cone::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;margin:0 auto;width:min(1240px,calc(100% - 2 * var(--gut)));
  clip-path:polygon(0 0,100% 0,54% 100%,46% 100%);background:linear-gradient(180deg,rgba(255,253,247,.65),rgba(255,253,247,.0))}
.cone::after{content:"";position:absolute;left:50%;bottom:0;width:1px;height:14px;background:var(--dl-gold);transform:translateX(-.5px)}

/* 底片带 */
.strip{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0;padding:0 0 0 0;border-top:1px solid var(--dl-hair);background:rgba(36,34,29,.06)}
.perf{position:absolute;left:0;right:0;height:6px;pointer-events:none;background:repeating-linear-gradient(90deg,var(--dl-hair-strong) 0 2px,transparent 2px 14px);opacity:.55}
.perf.t{top:5px}.perf.b{bottom:5px}
.track-w{position:relative;overflow:hidden;padding:20px 0}
.track{display:flex;gap:10px;height:100%;align-items:stretch;transition:transform .55s var(--dl-ease);will-change:transform;padding:0 1rem}
.frame{position:relative;flex:none;width:132px;display:flex;flex-direction:column;justify-content:space-between;padding:.5rem .6rem;text-align:left;
  border:1px solid var(--dl-hair-strong);border-radius:6px;background:var(--dl-paper-3);color:var(--dl-ink-2);opacity:.8;
  transition:opacity .35s var(--dl-ease),transform .35s var(--dl-ease),background .35s,border-color .35s}
.frame:hover{opacity:.9}
.frame .fn{display:flex;justify-content:space-between;font-size:.68rem;letter-spacing:.08em;color:var(--dl-ink-2)}
.frame .fc{font-family:var(--dl-display);font-size:.9rem;line-height:1.15;color:var(--dl-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.frame .ft{font-size:.7rem;color:var(--dl-ink-2)}
.frame.rv{border-style:dashed}
.frame[aria-current=true]{opacity:1;background:var(--dl-paper);border-color:var(--dl-ink);transform:translateY(-4px);box-shadow:0 0 0 1px var(--dl-ink),0 0 28px 6px rgba(255,253,247,.9)}
.frame[aria-current=true]::before{content:"";position:absolute;left:50%;top:-11px;width:1px;height:9px;background:var(--dl-gold);transform:translateX(-.5px)}
.frame.leaving{opacity:0;transform:translateY(-46px) scale(.96)}
.frame.entering{animation:enter .5s var(--dl-ease)}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.92)}}
.frame.sk{opacity:1;background:var(--dl-ink-wash);border-color:var(--dl-hair)}

/* 收片盒：处理后的底片在这里，随时撤销 */
.tray{display:flex;flex-direction:column;gap:.3rem;padding:12px 16px 10px 16px;border-left:1px solid var(--dl-hair);background:rgba(255,253,247,.55);min-width:0;overflow:hidden}
.tray h3{display:flex;justify-content:space-between;font-weight:500}
.tray ul{list-style:none;display:flex;flex-direction:column;gap:.3rem;overflow:auto;min-height:0}
.tray li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:center;font-size:.78rem;line-height:1.35;padding:.3rem .45rem;border-radius:8px;border:1px solid var(--dl-hair-2);background:var(--dl-paper)}
.tray li b{display:block;font-weight:500;color:var(--dl-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray li span{display:block;color:var(--dl-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray li .text-btn{min-height:30px;padding:.1rem .55rem;font-size:.78rem;border-color:var(--dl-hair-strong)}
.tray .none{font-size:.78rem;color:var(--dl-ink-3)}
.foot{display:flex;align-items:center;gap:1.4rem;padding:0 var(--gut);font-size:.74rem;color:var(--dl-ink-2);border-top:1px solid var(--dl-hair-2)}
.foot kbd{margin:0 .35rem 0 0}
.foot span{white-space:nowrap}

/* 状态：空 / 失败 / 加载 */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;text-align:center;padding:2rem;max-width:44ch;margin:0 auto}
.center h1{font-family:var(--dl-display);font-weight:400;font-size:2rem;letter-spacing:-.015em}
.center p{color:var(--dl-ink-2)}
.panel.off{background:transparent;border-style:dashed;border-color:var(--dl-hair-strong)}

@media (max-width:1100px){
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .strip{grid-template-columns:minmax(0,1fr) 220px}
  .foot span:nth-child(n+4){display:none}
  .ph{padding:18px 22px 12px}.c-src,.c-ai{padding:14px 22px}
}
@media (max-width:760px){
  body{overflow-y:auto}

  .panel{max-width:none;flex:none;overflow:visible}
  .ph{padding:16px 16px 12px;flex-direction:column;gap:.4rem}.ph .hd{text-align:left;max-width:none}
  .cols{display:flex;flex-direction:column}
  .c-ai{order:1;padding:14px 16px}.c-src{order:2;padding:14px 16px;border-right:0;border-top:1px solid var(--dl-hair-2)}
  .ai-box{overflow:visible}
  .cone{display:none}
  .stage::before{display:none}
  .strip{grid-template-columns:1fr;border-top:1px solid var(--dl-hair);margin-top:12px}
  .track-w{padding:22px 0 14px}
  .tray{border-left:0;border-top:1px solid var(--dl-hair)}
  .frame{width:118px}
  .foot{display:none}
  .acts .text-btn,.acts .solid{min-height:44px}
  .chip{min-height:40px}
  .statebar{bottom:6px}
  .frm-fx{font-size:.78rem}
}

    mountForm: mountForm, bindKeys: bindKeys, mountStateBar: mountStateBar, titleOf: titleOf, initFromHash: initFromHash, needsReview: needsReview,
    dateChips: dateChips, CUSTOMERS: D.CUSTOMERS, truncate: truncate, hm: hm };
})();

(function () {
  var E = Engine, S = E.S, esc = E.esc;
  var $ = function (id) { return document.getElementById(id); };
  var st = { cur: null, form: null, analysis: false, hot: true, busy: false, formCtl: null };

  function title(s) { return E.titleOf(s); }
  function shortTitle(s) { return s.customer ? s.customer.company : title(s); }

  /* ---------- 底片带 ---------- */
  function renderStrip(enterId) {
    var track = $('track');
    if (S.phase === 'loading') {
      track.innerHTML = new Array(9).join('<div class="frame sk" aria-hidden="true"></div>');
      track.style.transform = 'none'; return;
    }
    var list = S.phase === 'error' ? [] : E.open();
    var all = S.items;
    track.innerHTML = list.map(function (s) {
      var n = all.indexOf(s) + 1;
      return '<button type="button" class="frame' + (E.needsReview(s) ? ' rv' : '') + (enterId === s.id ? ' entering' : '') + '" data-id="' + s.id + '" tabindex="' + (s.id === st.cur ? 0 : -1) +
        '" aria-current="' + (s.id === st.cur) + '" aria-label="第 ' + n + ' 张，' + esc(shortTitle(s)) + '，' + esc(E.KIND[s.kind]) + '，' + esc(E.when(s.at)) + '">' +
        '<span class="fn num"><span>№ ' + (n < 10 ? '0' + n : n) + '</span><span>' + (E.needsReview(s) ? '待审阅' : esc(E.SOURCE[s.source])) + '</span></span>' +
        '<span class="fc">' + esc(shortTitle(s)) + '</span><span class="ft num">' + esc(E.when(s.at)) + '</span></button>';
    }).join('');
    center();
  }
  function center() {
    var track = $('track'), w = $('trackW'), el = track.querySelector('[aria-current=true]');
    if (!el) { track.style.transform = 'none'; return; }
    var x = w.clientWidth / 2 - (el.offsetLeft + el.offsetWidth / 2);
    track.style.transform = 'translateX(' + Math.round(x) + 'px)';
  }

  /* ---------- 收片盒（撤销） ---------- */
  function renderTray() {
    var t = $('tray'), h = S.history.slice(0, 2);
    t.innerHTML = '<h3 class="micro"><span>已收走</span><span class="num">' + S.history.length + '</span></h3>' +
      (h.length ? '<ul>' + h.map(function (e, i) {
        return '<li><div><b>' + esc(e.label) + '</b><span>' + esc(e.who) + ' · ' + esc(e.detail) + '</span></div>' +
          '<button type="button" class="text-btn" data-undo="' + e.id + '" aria-label="撤销：' + esc(e.label + '，' + e.who) + '">撤销' + (i === 0 ? '<kbd>Z</kbd>' : '') + '</button></li>';
      }).join('') + '</ul>' : '<p class="none">处理过的底片会收在这里，随时可以撤销。</p>');
  }

  /* ---------- 面板 ---------- */
  function ensureCur() {
    var list = E.open();
    if (!list.length) { st.cur = null; return; }
    if (!st.cur || !list.some(function (s) { return s.id === st.cur; })) st.cur = list[0].id;
  }
  function pos(s) { var l = E.open(); return l.indexOf(s) + 1; }

  function aiBox(s) {
    var a = s.ai || {};
    if (st.analysis) {
      return E.analysisHTML(s) + '<p class="why"><span>为什么需要你</span>' + esc(s.why) + '</p>' +
        (s.selaReview ? '<p class="why"><span>Sela 上下文</span>' + esc(s.selaReview.reason) + '</p>' : '') +
        '<ul class="known"><li>系统已知：' + esc(s.customer ? s.customer.company + ' · ' + s.customer.country + ' · ' + s.customer.contact : '尚未关联任何客户') + '</li></ul>';
    }
    var h = '<div class="an-h">' + E.h.aiTag(s.source === 'sela' ? 'AI 建议 · Sela' : 'AI 建议') + '<span class="an-t">整理草稿</span>' + (a.intent && a.intent !== '未知' ? E.h.intent(a.intent) : '') + '</div>' +
      '<p class="an-s">' + esc(a.summary || '') + '</p>';
    if (a.next) h += '<div class="an-next"><span>AI 建议的下一步（需你确认动作与日期）</span><p>' + esc(a.next) + '</p></div>';
    if (s.kind === 'identity' && s.candidates && s.candidates.length) {
      h += '<div class="pv" aria-label="AI 建议的归属候选">' + E.candidatesFor(s).map(function (c) {
        return '<div><span>' + esc(c.customer.company) + '<br><em>' + esc(c.reason) + '</em></span><span class="num">' + c.score + '%</span></div>';
      }).join('') + '</div>';
    }
    if (a.note) h += '<p class="an-note">' + esc(a.note) + '</p>';
    return h;
  }

  function actionsRow(s) {
    var acts = E.actionsFor(s), html = '';
    var blocked = s.kind === 'identity' && !s.customer;
    if (blocked) html += '<p class="hint">先确认归属；AI 的建议不会自动写入任何客户。</p>';
    acts.forEach(function (a) {
      html += '<button type="button" class="' + (a.lead ? 'solid' : 'text-btn') + '" data-act="' + a.id + '">' + esc(a.label) + '<kbd>' + a.num + '</kbd></button>';
    });
    return html;
  }

  function renderStage() {
    var stg = $('stage'), n = E.open().length;
    $('count').innerHTML = S.phase === 'ready' ? '<b class="num">' + n + '</b>条待判断' : '';
    var banner = '';
    if (S.phase === 'ready' && S.stale) banner = '<div class="banner" role="alert"><b>刷新失败</b><span>下面仍是 ' + S.loadedAt + ' 加载的内容，可以继续判断；恢复网络后再重试。</span><button type="button" class="text-btn" data-retry>重试</button></div>';

    if (S.phase === 'loading') {
      stg.innerHTML = '<div class="panel off" aria-busy="true" aria-label="正在加载"><div class="ph"><div class="ph-l sk-lines"><div class="sk sk-h"></div><div class="sk sk-l" style="width:40%"></div></div></div>' +
        '<div class="cols"><div class="c-src"><div class="sk-lines"><div class="sk sk-l"></div><div class="sk sk-l" style="width:92%"></div><div class="sk sk-l" style="width:70%"></div></div></div>' +
        '<div class="c-ai"><div class="sk-lines"><div class="sk sk-l" style="width:30%"></div><div class="sk sk-l"></div><div class="sk sk-l" style="width:80%"></div></div></div></div></div>';
      $('trackW').setAttribute('aria-busy', 'true'); renderTray(); return;
    }
    $('trackW').removeAttribute('aria-busy');
    if (S.phase === 'error') {
      stg.innerHTML = '<div class="panel off"><div class="center" role="alert"><h1>灯箱暂时点不亮</h1><p>Inbox 暂时无法加载。这不代表没有待判断的信号；已有内容没有丢失。</p>' +
        '<button type="button" class="solid" data-retry>重新加载<kbd>↵</kbd></button></div></div>';
      return;
    }
    if (!n) {
      stg.innerHTML = '<div class="panel off"><div class="center"><h1>灯箱已熄</h1><p>所有信号都判断完了，没有待处理的事项。新的客户回复或待归属沟通会在这里亮起。</p>' +
        (S.history.length ? '<p class="micro">刚处理的 ' + S.history.length + ' 条仍可撤销 · 按 Z</p>' : '') + '</div></div>';
      return;
    }
    var s = E.byId(st.cur), i = pos(s), acts = E.actionsFor(s);
    var subParts = [];
    if (s.customer) subParts.push(s.customer.contact + ' · ' + s.customer.country);
    subParts.push(s.sender); if (s.subject && s.source === 'gmail') subParts.push('主题：' + s.subject);
    stg.innerHTML = banner + '<article class="panel' + (st.form ? ' forming' : '') + '" aria-labelledby="pt">' +
      '<header class="ph"><div class="ph-l"><p class="micro kicker"><span class="pos num">№ ' + (S.items.indexOf(s) + 1) + ' / ' + S.items.length + '</span><span>' + esc(E.KIND[s.kind]) + '</span><span>' + esc(s.channel) + '</span><span class="num">' + esc(E.when(s.at)) + ' · ' + esc(E.ago(s.at)) + '</span>' +
        (E.needsReview(s) ? '<span class="rv">待审阅</span>' : '') + '</p>' +
        '<h1 id="pt" tabindex="-1">' + esc(title(s)) + '</h1><p class="sub">' + esc(subParts.join(' · ')) + '</p></div>' +
        '<div class="hd"><p>' + esc(s.headline) + '</p></div></header>' +
      '<div class="cols"><section class="c-src' + (st.hot ? '' : ' dim') + '" aria-label="来源原文"><h2 class="micro"><span>来源原文</span><button type="button" data-hot aria-pressed="' + st.hot + '">承诺高亮 ' + (st.hot ? '开' : '关') + '<kbd>H</kbd></button></h2>' +
        E.evidenceHTML(s, { lit: st.hot }) + (s.evidence.length > 1 ? '<p class="tr">共 ' + s.evidence.length + ' 条来源，按时间排列。</p>' : '') + '</section>' +
      '<section class="c-ai" aria-label="AI 建议与处理"><button type="button" class="text-btn ana" data-analysis aria-pressed="' + st.analysis + '">' + (st.analysis ? '收起分析' : '查看分析') + '<kbd>A</kbd></button><div class="ai-box" id="aiBox">' + aiBox(s) + '</div><div class="work" id="work">' + (st.form ? '' : '<div class="acts">' + actionsRow(s) + '</div>') + '</div></section></div></article>';
    if (st.form) {
      var act = acts.filter(function (a) { return a.id === st.form; })[0];
      if (act) st.formCtl = E.mountForm($('work'), s, act, { cancel: closeForm, done: function () {} });
      else st.form = null;
    }
  }

  function renderAll(enterId, focusTitle) {
    ensureCur(); renderStage(); renderStrip(enterId); renderTray();
    if (focusTitle) { var t = $('pt'); if (t) t.focus({ preventScroll: true }); }
  }

  /* ---------- 行为 ---------- */
  function go(delta) {
    if (S.phase !== 'ready' || st.busy) return;
    var l = E.open(); if (!l.length) return;
    var i = l.findIndex(function (s) { return s.id === st.cur; }), n = Math.max(0, Math.min(l.length - 1, i + delta));
    if (n === i) return;
    st.cur = l[n].id; st.form = null; st.analysis = false; renderAll(null, true);
  }
  function closeForm() { st.form = null; renderAll(); var b = document.querySelector('.acts .solid'); if (b) b.focus(); }
  function runAction(num) {
    if (S.phase !== 'ready' || st.busy || !st.cur) return;
    var s = E.byId(st.cur), a = E.actionsFor(s).filter(function (x) { return x.num === String(num); })[0];
    if (!a) return;
    if (a.direct) { E.commit(s.id, a.id, {}); return; }
    st.form = a.id; renderAll();
    if (st.formCtl) st.formCtl.focus();
  }
  function runLead() { var s = E.byId(st.cur); if (s) { var a = E.leadOf(s); runAction(a.num); } }

  E.on(function (ev) {
    if (ev.type === 'commit') {
      st.form = null; st.analysis = false;
      if (ev.entry.stays) { renderAll(null, true); return; }
      st.busy = true;
      var f = document.querySelector('.frame[data-id="' + ev.id + '"]'); if (f) f.classList.add('leaving');
      var p = document.querySelector('.panel'); if (p) p.classList.add('flash');
      E.later(function () {
        var l = E.open(), all = S.items.filter(function (x) { return x.status === 'open' || x.id === ev.id; }).sort(function (a, b) { return a.order - b.order; });
        var idx = all.findIndex(function (x) { return x.id === ev.id; });
        var nxt = all.slice(idx + 1).filter(function (x) { return x.status === 'open'; })[0] || all.slice(0, idx).reverse().filter(function (x) { return x.status === 'open'; })[0];
        st.cur = nxt ? nxt.id : null; st.busy = false; renderAll(null, true);
      }, 300);
    } else if (ev.type === 'undo') {
      st.cur = ev.id; st.form = null; st.analysis = false; st.busy = false; renderAll(ev.id, true);
    } else { st.form = null; st.busy = false; renderAll(); }
  });

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-analysis],[data-hot],[data-retry],[data-undo],.frame'); if (!t) return;
    if (t.dataset.act) { var s = E.byId(st.cur), a = E.actionsFor(s).filter(function (x) { return x.id === t.dataset.act; })[0]; runAction(a.num); }
    else if ('analysis' in t.dataset) { st.analysis = !st.analysis; renderAll(); }
    else if ('hot' in t.dataset) { st.hot = !st.hot; renderAll(); }
    else if ('retry' in t.dataset) E.retry();
    else if (t.dataset.undo) E.undo(t.dataset.undo);
    else if (t.classList.contains('frame') && !st.busy) { st.cur = t.dataset.id; st.form = null; st.analysis = false; renderAll(null, true); }
  });

  E.bindKeys({
    next: function () { go(1); }, prev: function () { go(-1); },
    action: runAction, enter: function () { if (S.phase === 'error') E.retry(); else runLead(); },
    analysis: function () { if (S.phase === 'ready' && st.cur) { st.analysis = !st.analysis; renderAll(); } },
    undo: function () { E.undo(); },
    esc: function () { if (st.form) closeForm(); else if (st.analysis) { st.analysis = false; renderAll(); } },
    extra: { ArrowRight: function () { go(1); }, ArrowLeft: function () { go(-1); }, h: function () { st.hot = !st.hot; renderAll(); }, H: function () { st.hot = !st.hot; renderAll(); } }
  });
  window.addEventListener('resize', center);
  E.mountStateBar(); E.initFromHash(); renderAll();
})();
</script>
