<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trosa · Today 03 潮汐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Inter:wght@300;400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ===== shared harness (inlined by build) — tokens mirror app/static/visual-v3.css :root ===== */
:root{
  --dl-hi:#faf8f2;--dl-canvas:#efeae0;--dl-canvas-low:#ded6c6;--dl-paper:#fffdf7;--dl-paper-2:#fbf8f1;--dl-paper-3:#f5f1e7;
  --dl-ink:#24221d;--dl-ink-2:#57534a;--dl-ink-3:#6f6a5f;--dl-mut:#8a8478;--dl-faint:#b7b1a4;
  --dl-gold:#bc9052;--dl-gold-ink:#8a6224;--dl-gold-soft:#f3e7d3;--dl-gold-wash:rgba(188,144,82,.10);
  --dl-danger:#a4443a;
  --dl-hair:rgba(36,34,29,.13);--dl-hair-2:rgba(36,34,29,.07);--dl-hair-strong:rgba(36,34,29,.26);
  --dl-ink-wash:rgba(36,34,29,.05);--dl-ink-wash-2:rgba(36,34,29,.09);
  --dl-display:"Newsreader","Source Serif 4",Georgia,"Iowan Old Style","PingFang SC","Noto Sans SC Variable","Source Han Sans SC","Microsoft YaHei UI",system-ui,sans-serif;
  --dl-sans:"Inter","Noto Sans SC Variable","Source Han Sans SC","PingFang SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
  --dl-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --dl-ease:cubic-bezier(.16,1,.3,1);
  --gut:clamp(1rem,3.4vw,3rem);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--dl-sans);font-size:.95rem;line-height:1.5;color:var(--dl-ink);background:var(--dl-canvas);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--dl-gold-ink);outline-offset:3px;border-radius:3px}
svg :focus-visible{outline-offset:4px}
[hidden]{display:none!important}

/* the ONLY solid element on any room */
.solid{display:inline-flex;align-items:center;gap:.5rem;background:var(--dl-ink);color:#f6f2e9;border-radius:999px;padding:.62rem 1.3rem;font-size:.86rem;letter-spacing:.03em;font-weight:500;transition:background .25s var(--dl-ease)}
.solid:hover{background:#3a3730}
.solid[disabled]{opacity:.6;cursor:progress}
.solid:focus-visible{outline-color:var(--dl-ink);outline-offset:3px}
.txt{font-size:.82rem;color:var(--dl-ink-2);padding:.4rem .2rem;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.txt:hover{color:var(--dl-ink);border-color:var(--dl-hair-strong)}
.micro{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dl-ink-2)}
.serif{font-family:var(--dl-display)}
.ghostbtn{font-size:.8rem;color:var(--dl-ink);padding:.36rem .9rem;border:1px solid var(--dl-hair-strong);border-radius:999px;transition:background .2s}
.ghostbtn:hover{background:var(--dl-paper)}
.err-text{color:var(--dl-danger)}

/* demo-state switcher (prototype-only chrome) */
.proto-states{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .1rem;font-size:.7rem;color:var(--dl-ink-2)}
.proto-states b{font-weight:400;letter-spacing:.14em;text-transform:uppercase;margin-right:.5rem;font-size:.62rem}
.proto-states button{font-size:.72rem;color:var(--dl-ink-2);padding:.22rem .5rem;border-bottom:1px solid transparent}
.proto-states button:hover{color:var(--dl-ink)}
.proto-states button[aria-pressed="true"]{color:var(--dl-ink);border-color:var(--dl-gold)}

/* toast (transient layer: hairline paper, no fill weight) */
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:1rem;justify-content:space-between;width:100%;background:var(--dl-paper);border:1px solid var(--dl-hair-strong);border-radius:10px;padding:.55rem .9rem;font-size:.82rem;box-shadow:0 8px 24px rgba(36,34,29,.08);animation:toastIn .4s var(--dl-ease)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}

/* composer */
.cmp{display:grid;gap:.7rem;text-align:left}
.cmp-f{display:grid;gap:.25rem}
.cmp-f>span,.cmp legend{font-size:.72rem;letter-spacing:.06em;color:var(--dl-ink-2)}
.cmp-f>span em{font-style:normal;color:var(--dl-gold-ink);margin-left:.3rem}
.cmp textarea,.cmp input[type=text],.cmp input[type=date],.cmp select{width:100%;background:var(--dl-paper);border:1px solid var(--dl-hair);border-radius:8px;padding:.5rem .65rem;font-size:.88rem;line-height:1.45;resize:none}
.cmp textarea:focus,.cmp input:focus,.cmp select:focus{outline:2px solid var(--dl-gold-ink);outline-offset:1px;border-color:transparent}
.cmp-row{display:flex;flex-wrap:wrap;gap:.5rem 1.4rem}
.cmp fieldset{border:0;display:flex;flex-wrap:wrap;align-items:center;gap:.3rem}
.cmp legend{float:left;margin-right:.6rem;padding:0;line-height:1.9}
.cmp .chip{position:relative;display:inline-block}
.cmp .chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.cmp .chip span{display:inline-block;font-size:.8rem;padding:.2rem .7rem;border:1px solid var(--dl-hair);border-radius:999px;color:var(--dl-ink-2);transition:all .2s}
.cmp .chip input:checked+span{border-color:var(--dl-gold-ink);color:var(--dl-ink);background:var(--dl-gold-wash)}
.cmp .chip input:focus-visible+span{outline:2px solid var(--dl-gold-ink);outline-offset:2px}
.cmp-next{display:grid;gap:.5rem;padding-top:.2rem;border-top:1px solid var(--dl-hair-2)}
.cmp-next .qd{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.cmp-next .qd .chip span{font-size:.74rem;padding:.14rem .55rem}
.cmp-actions{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.cmp-msg{font-size:.78rem;min-height:1.1em}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important;transition-delay:0s!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}}


/* ================= 03 潮汐 · the tide table =================
   Not a list of tasks: a timetable of WHEN the other side is at work. Every row is a customer;
   its bar is their 09–18 window projected onto our day. The tide above counts how many windows are open. */
body{overflow:hidden;background:linear-gradient(180deg,var(--dl-hi) 0%,var(--dl-canvas) 70%,var(--dl-canvas-low) 100%)}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);position:relative}
.top{display:flex;align-items:center;gap:1.2rem;padding:0 var(--gut);height:clamp(48px,6vh,60px);border-bottom:1px solid var(--dl-hair-2)}
.brand{font-family:var(--dl-display);font-size:1.05rem}
.top h1{font-family:var(--dl-display);font-weight:400;font-size:1rem;color:var(--dl-ink-2)}
.top .now{margin-left:auto;display:flex;gap:1rem;align-items:baseline;font-size:.78rem;color:var(--dl-ink-2)}
.top .now b{font-family:var(--dl-mono);font-weight:400;font-size:.85rem;color:var(--dl-ink)}
.banner{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;padding:.5rem var(--gut);font-size:.82rem;color:var(--dl-ink-2);border-bottom:1px solid var(--dl-hair-2);background:var(--dl-paper-2)}
.banner:empty{padding:0;border:0;min-height:0}
.banner .ghostbtn{padding:.16rem .8rem}

.page{display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) clamp(220px,19vw,270px);gap:0 clamp(1.2rem,2.6vw,2.6rem);padding:clamp(.6rem,2vh,1.3rem) var(--gut) 0;min-height:0}
.main{display:flex;flex-direction:column;min-height:0;position:relative}
:root{--c1:clamp(210px,19vw,270px);--c3:clamp(190px,17vw,240px)}
.row3{display:grid;grid-template-columns:var(--c1) minmax(0,1fr) var(--c3);align-items:center}

/* --- the tide --- */
.tide{border-bottom:1px solid var(--dl-hair);padding-bottom:.2rem}
.tide .row3{align-items:end}
.tide h2{font-family:var(--dl-display);font-weight:400;font-size:1.25rem;line-height:1.15}
.tide .lede{font-size:.8rem;color:var(--dl-ink-2);margin-top:.35rem;padding-right:1rem}
.tide .lede .ghostbtn{padding:.1rem .7rem;margin-left:.3rem}
.tide .sum{padding-left:1.1rem;font-size:.78rem;color:var(--dl-ink-2);padding-bottom:1.3rem;line-height:1.4}
.tide .sum b{display:block;font-family:var(--dl-mono);font-weight:400;font-size:.85rem;color:var(--dl-ink)}
.chartcol{position:relative;height:118px;cursor:crosshair;touch-action:none}
.chartcol:focus-visible{outline-offset:2px}
.chartcol svg{position:absolute;left:0;top:0;width:100%;height:96px;display:block;overflow:visible}
.chartcol .hrs{position:absolute;left:0;right:0;bottom:0;height:20px}
.chartcol .hrs span{position:absolute;transform:translateX(-50%);font-family:var(--dl-mono);font-size:.62rem;color:var(--dl-ink-2)}
.chartcol .hrs span:first-child{transform:none}.chartcol .hrs span:last-child{transform:translateX(-100%)}
.cnow,.cpv{display:none;position:absolute;top:0;height:88px;width:0;border-left:1.5px solid var(--dl-gold-ink);pointer-events:none}
.cpv{border-left:1.5px dashed var(--dl-ink-3)}
.curve{fill:none;stroke:var(--dl-ink);stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.curve.ebb{opacity:.28}
.tidefill{stroke:none}
.baseline{stroke:var(--dl-hair-strong);stroke-width:1;vector-effect:non-scaling-stroke}
.gridv{stroke:var(--dl-hair-2);stroke-width:1;vector-effect:non-scaling-stroke}
.tide.flat .curve{stroke-dasharray:3 4}

/* now / preview lines run through the whole table */
.tt{position:relative}
.vline{position:absolute;top:0;bottom:0;width:0;left:calc(var(--c1) + (100% - var(--c1) - var(--c3)) * var(--x));pointer-events:none;z-index:2;transition:left .5s var(--dl-ease)}
.vline::before{content:"";position:absolute;top:0;bottom:0;left:-.5px;border-left:1.5px solid var(--dl-gold-ink)}
.vline .tag{position:absolute;top:-2px;left:0;transform:translate(-50%,-100%);font-family:var(--dl-mono);font-size:.68rem;color:var(--dl-gold-ink);white-space:nowrap;background:linear-gradient(transparent,var(--dl-canvas) 40%);padding:0 .3rem}
.vline.pv::before{border-left-style:dashed;border-color:var(--dl-ink-2);opacity:.9}
.vline.pv .tag{color:var(--dl-ink-2)}
.vline.ghost{opacity:.5;transition:none}
.vline.ghost::before{border-left:1px solid var(--dl-ink-3)}
.vline[hidden]{display:none}

/* --- the table --- */
.rows{flex:1;min-height:0;overflow:auto;padding:.2rem 0 .6rem;scrollbar-width:thin}
.grp{padding:.75rem 0 .3rem;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dl-ink-2)}
.grp b{font-weight:500;color:var(--dl-ink);letter-spacing:.06em;margin-left:.5rem}
.grp.open{color:var(--dl-gold-ink)}
.rows ul{list-style:none}
.trow{width:100%;text-align:left;border-bottom:1px solid var(--dl-hair-2);min-height:46px;position:relative;padding:.3rem 0;transition:background .3s var(--dl-ease);border-radius:2px}
.trow:hover{background:rgba(255,253,247,.6)}
.trow[aria-pressed="true"]{background:var(--dl-paper);box-shadow:0 0 0 1px var(--dl-hair),inset 3px 0 0 var(--dl-gold)}
.trow .c1{display:grid;padding:0 .8rem 0 .7rem;min-width:0}
.trow .nm{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline}
.trow .nm b{font-weight:500;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .nm i{font-style:normal;font-size:.72rem;color:var(--dl-ink-2);white-space:nowrap}
.trow .ac{font-size:.78rem;color:var(--dl-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow[aria-pressed="true"] .ac{color:var(--dl-ink-2)}
.track{position:relative;height:16px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--dl-hair-2) calc(25% - 1px) 25%);border-bottom:1px solid var(--dl-hair);display:block}
.win{position:absolute;top:2px;bottom:1px;border:1px solid var(--dl-ink-3);background:rgba(255,253,247,.85);border-radius:2px}
.win.gone{border-style:dashed;border-color:var(--dl-faint);background:transparent}
.win.on{border-color:var(--dl-gold-ink);background:var(--dl-gold-wash)}
.win.cut-l{border-left:0;border-radius:0 2px 2px 0}.win.cut-r{border-right:0;border-radius:2px 0 0 2px}
.trow .c3{padding:0 .4rem 0 1.1rem;display:grid;font-size:.78rem;line-height:1.35}
.trow .c3 b{font-weight:500;color:var(--dl-ink)}
.trow .c3 b.on{color:var(--dl-gold-ink)}
.trow .c3 span{color:var(--dl-ink-2);font-size:.74rem}
.trow .nowtick{display:none}
.trow.flip{will-change:transform}

/* --- the dock (selected task) --- */
.dock{border-top:1px solid var(--dl-hair-strong);background:linear-gradient(180deg,rgba(255,253,247,.55),var(--dl-paper));padding:.8rem 0 .9rem;position:relative;z-index:4}
.dock .row3{align-items:start}
.dock .k{padding:0 .8rem 0 .7rem}
.dock .kick{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dl-ink-2)}
.dock .kick.gold{color:var(--dl-gold-ink)}
.dock h3{font-family:var(--dl-display);font-weight:400;font-size:1.4rem;line-height:1.12;margin-top:.25rem;letter-spacing:-.01em}
.dock .where{font-size:.76rem;color:var(--dl-ink-2);margin-top:.3rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.dock .mid{padding:0 1.4rem 0 0}
.dock .act{font-family:var(--dl-display);font-size:1.2rem;line-height:1.2;margin-top:.25rem}
.dock .last{font-family:var(--dl-display);font-style:italic;color:var(--dl-ink-2);font-size:.9rem;margin-top:.35rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dock .last small{font-family:var(--dl-sans);font-style:normal;color:var(--dl-ink-2);font-size:.72rem}
.dock .acts{padding-left:1.1rem;display:flex;flex-direction:column;align-items:flex-start;gap:.3rem}
.dock .acts .links{display:flex;gap:.6rem;flex-wrap:wrap}
.dock.rec{position:absolute;left:0;right:0;bottom:0;padding:1rem 0 1.1rem;box-shadow:0 -18px 50px -20px rgba(36,34,29,.16);background:var(--dl-paper);border-top:1px solid var(--dl-hair-strong)}
.dock.rec .recgrid{display:grid;grid-template-columns:var(--c1) minmax(0,1fr);gap:0}
.dock.rec .recgrid>.cmpwrap{padding:0 1.4rem 0 1.2rem;max-width:720px}
.dock.rec h3{font-size:1.25rem}
.main.recording .rows,.main.recording .tide{opacity:.4;transition:opacity .4s var(--dl-ease);pointer-events:none}
.sun{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--dl-gold-ink);background:var(--dl-paper);box-shadow:0 0 8px 2px rgba(188,144,82,.55);flex:none}
.sun.dusk{border-color:var(--dl-ink-2);box-shadow:0 0 5px 1px rgba(188,144,82,.25)}
.sun.night{border:1.5px dashed var(--dl-faint);box-shadow:none}

/* --- later column --- */
.later{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--dl-hair);padding-left:clamp(1rem,1.8vw,1.6rem)}
.later h2{font-family:var(--dl-display);font-weight:400;font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline}
.later h2 small{font-family:var(--dl-sans);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dl-ink-2)}
.laterbody{display:flex;flex-direction:column;min-height:0;flex:1}
.later ul{list-style:none;margin-top:.5rem;overflow:auto;min-height:0;flex:1}
.later li button{display:grid;grid-template-columns:3.6rem 1fr;gap:.6rem;text-align:left;width:100%;padding:.55rem .2rem;border-bottom:1px solid var(--dl-hair-2);font-size:.8rem;transition:background .2s}
.later li button:hover{background:rgba(255,253,247,.6)}
.later li button[aria-pressed="true"]{box-shadow:inset 2px 0 0 var(--dl-gold);background:var(--dl-paper)}
.later time{font-family:var(--dl-mono);font-size:.72rem;color:var(--dl-ink-2);padding-top:.1rem}
.later b{font-weight:500;display:block;color:var(--dl-ink-2)}
.later span{color:var(--dl-ink-2);font-size:.76rem;display:block}
.later .msg{font-size:.82rem;color:var(--dl-ink-2);padding:.8rem 0}
.wk{border-top:1px solid var(--dl-hair);margin-top:.4rem;padding:.4rem 0 .7rem}
.wk summary{cursor:pointer;font-size:.8rem;color:var(--dl-ink-2);padding:.3rem 0;list-style:none;display:flex;justify-content:space-between}
.wk summary::-webkit-details-marker{display:none}
.wk summary::after{content:"+";color:var(--dl-ink-2)}
.wk[open] summary::after{content:"–"}
.wk summary:focus-visible{outline:2px solid var(--dl-gold-ink);outline-offset:2px}
.wk ul{max-height:34vh;margin-top:.3rem}
.wk li{padding:.5rem 0;border-bottom:1px solid var(--dl-hair-2);font-size:.78rem;display:grid;grid-template-columns:3rem 1fr;gap:.5rem}
.wk li time{color:var(--dl-ink-2);font-family:var(--dl-mono);font-size:.7rem}
.wk li b{font-weight:500}
.wk li span{display:block;color:var(--dl-ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wk li small{color:var(--dl-ink-2)}
.keys{font-size:.68rem;color:var(--dl-ink-2);display:flex;gap:.8rem;flex-wrap:wrap;padding:.4rem 0}
.keys kbd{font-family:var(--dl-mono);font-size:.66rem;border:1px solid var(--dl-hair-strong);border-radius:4px;padding:0 .3rem;margin-right:.25rem;color:var(--dl-ink-2)}

.sk-bar{display:block;height:11px;border-radius:5px;background:var(--dl-ink-wash);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.msg2{padding:2rem 0 1rem;max-width:44ch}
.msg2 strong{display:block;font-family:var(--dl-display);font-weight:400;font-size:1.5rem;margin-bottom:.3rem}
.msg2 p{color:var(--dl-ink-2);font-size:.88rem}
.msg2 .row{margin-top:1rem;display:flex;gap:.8rem;align-items:center}

.demo{padding:.4rem 0 .6rem}

/* --- narrow: rows become stacked, the dock sticks to the bottom --- */
@media (max-width:1000px){
  :root{--c1:180px;--c3:170px}
  .tide .sum{display:none}
  .trow .c3{padding-left:.6rem}
}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100%;grid-template-rows:auto auto auto}
  .page{display:block;padding-bottom:1rem}
  .later .laterbody{flex:none}
  .main{min-height:0}
  .row3{grid-template-columns:1fr}
  .tide .row3{gap:.4rem}
  .tide h2{font-size:1.1rem}
  .chartcol{margin:.3rem 0 .3rem}
  .vline{display:none}
  .rows{overflow:visible}
  .trow{padding:.55rem 0 .6rem;min-height:0}
  .trow .c1{padding:0 .3rem}
  .trow .track{margin:.4rem .3rem .2rem}
  .trow .nowtick{display:block;position:absolute;top:-2px;bottom:-2px;left:calc(var(--x) * 100%);border-left:1.5px solid var(--dl-gold-ink);z-index:1}
  .trow .c3{padding:0 .3rem;grid-template-columns:1fr;gap:0}
  .dock{position:sticky;bottom:0;margin:0 calc(var(--gut) * -1);padding:.7rem var(--gut) .8rem;box-shadow:0 -12px 30px -16px rgba(36,34,29,.2);background:var(--dl-paper)}
  .dock .row3{gap:.5rem}
  .dock .k,.dock .acts{padding:0}
  .dock .mid{display:none}
  .dock .acts .solid{width:100%;justify-content:center}
  .dock h3{font-size:1.2rem}
  .dock.rec{position:fixed;inset:auto 0 0 0;margin:0;max-height:92vh;overflow:auto;padding:1rem var(--gut) 1.2rem;z-index:30}
  .dock.rec .recgrid{grid-template-columns:1fr}
  .dock.rec .recgrid>.cmpwrap{padding:.6rem 0 0}
  .later{border-left:0;padding-left:0;border-top:1px solid var(--dl-hair);margin-top:1rem;padding-top:.8rem}
  .later ul{overflow:visible}
  .keys{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand">Trosa</span><h1>今天</h1>
    <div class="now"><span id="dateTxt"></span><b id="clockTxt" aria-label="现在时间"></b></div>
  </header>
  <div class="banner" id="banner" role="status"></div>
  <div class="page">
    <main class="main" id="main">
      <div class="tt" id="tt">

<script>

  var TASKS0 = [

  ];
  var LEVEL_W = { A: 30, B: 20, C: 10 };
  var nextId = 900;

  function makeTask(t) {
    var c = byCust[t[1]], due = addDays(todayISO(), t[2]);

      id: t[0], customer_id: c.id, customer_company: c.company, customer_name: c.contact, country: c.country, field: c.field,

      _tz: c.tz, _city: c.city

  }
  function decorate(t) {

    return t;
  }
  var tasks = TASKS0.map(makeTask).map(decorate);
  var weekly = WEEKLY0.map(function (w, i) {
    var c = byCust[w.cid];

  function sortApi(list) {

  }
  function dueList() { return sortApi(tasks.filter(function (t) { return diff(t.remind_date) <= 0; })); }
  function upcomingList() { return tasks.filter(function (t) { var d = diff(t.remind_date); return d > 0 && d <= 14; }).sort(function (a, b) { return a.remind_date.localeCompare(b.remind_date) || a.id - b.id; }); }

  /* ---------- state machine ---------- */

  var stateNames = [['ready', '正常'], ['loading', '加载中'], ['empty', '今天已清空'], ['stale', '刷新失败'], ['cold', '首次加载失败']];

  function record(p) {

    weekly = [{ id: nextId++, follow_date: todayISO(), customer_id: c.id, customer_company: c.company, content: p.what, result: p.next ? '已安排：' + p.next.action + '（' + md(p.next.date) + '）' : '未设下一步', channel: p.channel || '邮件', has_next: !!p.next }].concat(weekly);

      '<div class="cmp-next" ' + (rec ? 'hidden' : '') + '>' +
      '<label class="cmp-f"><span>下一步要做什么</span><input type="text" name="action" placeholder="一句明确的动作" value="' + (rec ? '' : esc(o.taskTitle || '')) + '"></label>' +

      '<div class="cmp-msg" role="alert"></div>' +

    var f = host.querySelector('form'), msg = host.querySelector('.cmp-msg'), nextBox = host.querySelector('.cmp-next'), tog = host.querySelector('.cmp-toggle'), save = host.querySelector('.cmp-save');

    function setDate(v) {

    c.addEventListener('keydown', function (e) {
      var step = e.shiftKey ? 180 : 30, cur = atMin();
      if (e.key === 'ArrowRight') { e.preventDefault(); setPv(cur + step); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); setPv(cur - step); }
      else if (e.key === 'Home' || e.key === 'Escape') { e.preventDefault(); setPv(null); }
    });
  }

  /* ---------- composer in the dock ---------- */
  function openRec(mode) {
    if (rec || !(view.mode === 'ready' || view.mode === 'stale' || view.mode === 'empty' || view.mode === 'retrying')) return;
    var t = sel && taskById(sel); if (mode === 'schedule' && !t) return;
    rec = mode;
    var host = $('dock'); $('main').classList.add('recording'); host.classList.add('rec');
    var li = t && T.localInfo(t._tz, atDate(view));
    host.innerHTML = '<div class="recgrid"><div class="k" style="padding:0 .8rem 0 .7rem"><span class="kick gold">' + (mode === 'schedule' ? '安排下一步' : '记录沟通') + '</span><h3>' + esc(t ? t.customer_company : '选一位客户') + '</h3>' + (t ? '<div class="where"><span>' + esc(t.country + ' · ' + t._city) + '</span><span class="sun ' + li.sun + '" aria-hidden="true"></span><span>当地 ' + li.time + '</span></div><p class="act" style="font-size:1.05rem;margin-top:.7rem">' + esc(t.task_title) + '</p>' + (t.last_activity ? '<p class="last" style="margin-top:.5rem">“' + esc(t.last_activity) + '”</p>' : '') : '') + '</div><div class="cmpwrap" id="cmpHost"></div></div>';
    cmp = T.composer($('cmpHost'), { customer: t ? { id: t.customer_id } : null, taskId: t ? t.id : null, mode: mode, taskTitle: t ? t.task_title : '', rows: 3, onCancel: closeRec, onSave: function (p) { save(p, t); } });
    cmp.focus();
  }
  function closeRec() { rec = null; cmp = null; renderDock(view); var b = $('dock').querySelector('[data-act="rec"]'); if (b) b.focus(); }
  function save(p, t) {
    var name = t ? t.customer_company : T.cust[p.customer_id].company;
    var idx = t ? ordered.findIndex(function (x) { return x.t.id === t.id; }) : 0;
    var old = snap();
    rec = null; cmp = null;
    if (p.mode === 'schedule') T.reschedule(t.id, p.next.action, p.next.date); else T.record(p);
    var v2 = T.view(), m = atMin(), g = build(v2, m).flat;
    if (p.mode === 'schedule') sel = t.id; else sel = g.length ? g[Math.min(Math.max(idx, 0), g.length - 1)].t.id : null;
    render(v2, old);
    T.toast(p.mode === 'schedule' ? '已改为 ' + T.md(p.next.date) + ' · ' + p.next.action : '已记录 ' + name + (p.next ? '，下一步 ' + T.md(p.next.date) : '，未设下一步'), function () { T.undo(); });
    var b = $('dock').querySelector('[data-act="rec"]'); if (b) b.focus();
  }

  /* ---------- master render ---------- */
  function render(v, oldSnap) {
    v = v && v.mode ? v : T.view();
    view = v; winCache = {};
    var ready = v.mode === 'ready' || v.mode === 'stale' || v.mode === 'retrying';
    if (ready) {
      var g = build(v, atMin()).flat.map(function (x) { return x.t.id; });
      var all = g.concat(v.upcomingFailed ? [] : v.upcoming.map(function (t) { return t.id; }));
      if (sel == null || all.indexOf(sel) < 0) sel = g.length ? g[0] : (v.upcoming[0] && !v.upcomingFailed ? v.upcoming[0].id : null);
    } else sel = null;
    renderChrome(v); renderTide(v);
    var pre = oldSnap || null;
    renderRows(v, false); if (pre) flip(pre);
    renderDock(v); renderLater(v);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (b) {
      var a = b.dataset.act;
      if (a === 'retry') T.retry(); else if (a === 'rec') openRec('record'); else if (a === 'next') openRec('schedule');
      else if (a === 'open') T.toast('原型：这里会打开客户详情。'); else if (a === 'now') setPv(null);
      return;
    }
    var r = e.target.closest('.trow[data-id], .later button[data-id]');
    if (r) select(+r.dataset.id);
  });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (rec) return;
    if (e.target.id === 'chart') return;
    var k = e.key.toLowerCase();
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (e.target.closest && e.target.closest('summary')) return;
      var i = ordered.findIndex(function (x) { return x.t.id === sel; }); if (i < 0 && !ordered.length) return;
      e.preventDefault(); var n = ordered[Math.max(0, Math.min(ordered.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; if (n) select(n.t.id, true);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setPv(atMin() + (e.key === 'ArrowRight' ? 30 : -30)); }
    else if (e.key === 'Escape' && pv != null) setPv(null);
    else if (k === 'r') { e.preventDefault(); openRec('record'); }
    else if (k === 'n') { e.preventDefault(); openRec('schedule'); }
  });

  T.start(function (v) { render(v); }, function (v) { if (pv == null) render(v); else { view = v; $('clockTxt').textContent = T.pad(v.home.h) + ':' + T.pad(v.home.mi); } });
  var q = new URLSearchParams(location.search).get('pv');
  if (q && /^\d{1,2}:\d{2}$/.test(q)) { var pp = q.split(':'); setTimeout(function () { setPv(+pp[0] * 60 + +pp[1]); }, 50); }
})();
</script>
</body>
