<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户 · 03 台账</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Shared Daylight material for the three customer-list rooms.
   Tokens are copied from app/static/visual-v3.css :root (--dl-*). Nothing here
   adds a colour family, a font family, glass, or a heavy shadow. */
:root{
  --dl-hi:#faf8f2; --dl-canvas:#efeae0; --dl-canvas-low:#ded6c6;
  --dl-paper:#fffdf7; --dl-paper-2:#fbf8f1; --dl-paper-3:#f5f1e7;
  --dl-ink:#24221d; --dl-ink-2:#57534a; --dl-ink-3:#6f6a5f; --dl-mut:#8a8478; --dl-faint:#b7b1a4;
  --dl-gold:#bc9052; --dl-gold-ink:#8a6224; --dl-gold-soft:#f3e7d3; --dl-gold-wash:rgba(188,144,82,.10);
  --dl-danger:#a4443a; --dl-danger-soft:#f6e6e3;
  --dl-hair:rgba(36,34,29,.13); --dl-hair-2:rgba(36,34,29,.07); --dl-hair-strong:rgba(36,34,29,.26);
  --dl-shadow-2:0 8px 24px rgba(36,34,29,.08);
  --dl-display:"Newsreader","Source Serif 4",Georgia,"Iowan Old Style","PingFang SC","Noto Sans SC Variable","Source Han Sans SC","Microsoft YaHei UI",system-ui,sans-serif;
  --dl-sans:"Inter","Noto Sans SC Variable","Source Han Sans SC","PingFang SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
  --dl-ease:cubic-bezier(.16,1,.3,1);
  --gut:clamp(1rem,3.2vw,3rem);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--dl-sans);font-size:14px;line-height:1.5;color:var(--dl-ink);background:var(--dl-canvas);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
.serif{font-family:var(--dl-display);font-weight:400}
.micro{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dl-ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--dl-gold-ink);outline-offset:3px;border-radius:4px}
mark.hl{background:none;color:inherit;box-shadow:inset 0 -.42em 0 var(--dl-gold-soft);border-radius:1px}

/* the only solid element on a page: the primary action */
.solid{display:inline-flex;align-items:center;gap:.55rem;height:40px;padding:0 1.15rem;border-radius:999px;
  background:var(--dl-ink);color:var(--dl-paper);font-size:.84rem;letter-spacing:.02em;white-space:nowrap;
  transition:background .2s var(--dl-ease)}
.solid:hover{background:#37342c}
.solid kbd{font:inherit;font-size:.72rem;color:var(--dl-paper);background:transparent;border-color:rgba(255,253,247,.38)}
.ghost{display:inline-flex;align-items:center;height:32px;padding:0 .8rem;border-radius:999px;font-size:.8rem;color:var(--dl-ink-2);
  border:1px solid transparent;white-space:nowrap}
.ghost:hover{color:var(--dl-ink);border-color:var(--dl-hair);background:var(--dl-paper)}
.ghost[aria-pressed=true]{color:var(--dl-ink);border-color:var(--dl-hair-strong);background:var(--dl-paper)}
/* while a batch is active its action becomes the solid one; the open button steps down */
body.has-sel .solid.is-open{background:transparent;color:var(--dl-ink);box-shadow:inset 0 0 0 1px var(--dl-hair-strong)}
body.has-sel .solid.is-open:hover{background:var(--dl-paper)}
body.has-sel .solid.is-open kbd{color:var(--dl-ink-2);border-color:var(--dl-hair)}

kbd{font-family:var(--dl-sans);font-size:.7rem;color:var(--dl-ink-2);border:1px solid var(--dl-hair);border-radius:5px;padding:0 .35rem;line-height:1.35;background:var(--dl-paper-2)}

/* search field (shape is room-specific; behaviour is shared) */
.q{display:flex;align-items:center;gap:.6rem;min-width:0}
.q input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:1rem}
.q input::placeholder{color:var(--dl-ink-3)}
.q .clear{display:none;font-size:.78rem;color:var(--dl-ink-2);padding:.2rem .4rem;border-radius:6px}
.q.has-text .clear{display:inline-block}
.q.has-text kbd{display:none}

/* view row: dynamic views computed from real activity, counts included */
.views{display:flex;flex-wrap:wrap;gap:.15rem .25rem;align-items:center}
.views button{display:inline-flex;align-items:baseline;gap:.4rem;padding:.3rem .7rem;border-radius:999px;font-size:.84rem;color:var(--dl-ink-2);
  border:1px solid transparent;transition:color .2s,background .2s}
.views button i{font-style:normal;font-size:.72rem;color:var(--dl-ink-2)}
.views button:hover{color:var(--dl-ink);background:var(--dl-paper)}
.views button[aria-selected=true]{color:var(--dl-ink);border-color:var(--dl-hair-strong);background:var(--dl-paper)}
.views button[aria-selected=true] i{color:var(--dl-gold-ink)}

/* batch tray: appears only after the user explicitly selects several rows */
.tray{display:none;align-items:center;gap:.4rem;padding:.35rem .5rem .35rem .95rem;border-radius:999px;background:var(--dl-paper);
  border:1px solid var(--dl-hair-strong);box-shadow:var(--dl-shadow-2);font-size:.82rem;white-space:nowrap}
.tray.on{display:inline-flex}
.tray .n{margin-right:.5rem;color:var(--dl-ink-2)}
.tray .n b{font-family:var(--dl-display);font-weight:400;font-size:1.1rem;color:var(--dl-ink);margin-right:.1rem}
.tray .solid{height:34px;padding:0 1rem;font-size:.8rem}

/* live status for actions that the prototype only simulates */
#live{position:fixed;left:50%;bottom:1rem;transform:translate(-50%,8px);max-width:min(560px,calc(100vw - 2rem));z-index:60;padding:.55rem 1rem;border-radius:999px;
  background:var(--dl-paper);border:1px solid var(--dl-hair-strong);box-shadow:var(--dl-shadow-2);font-size:.8rem;color:var(--dl-ink);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--dl-ease);text-align:center}
#live.on{opacity:1;transform:translate(-50%,0)}

/* prototype-only control: switch data states */
.devbar{position:fixed;right:.7rem;top:.3rem;z-index:55;display:flex;align-items:center;gap:.15rem;font-size:.68rem;color:var(--dl-ink-2)}
.devbar b{font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin-right:.3rem;font-size:.6rem}
.devbar button{padding:.15rem .5rem;border-radius:999px;color:var(--dl-ink-2);font-size:.7rem}
.devbar button:hover{background:var(--dl-paper);color:var(--dl-ink)}
.devbar button[aria-pressed=true]{background:var(--dl-paper);box-shadow:inset 0 0 0 1px var(--dl-hair-strong);color:var(--dl-ink)}
body.embed .devbar{display:none}
@media (max-width:700px){.devbar{display:none}}

/* four honest states. Same words for everyone; each room dresses them differently. */
.st{display:none}
.st[data-kind]{display:block}
.st h3{font-family:var(--dl-display);font-weight:400}
.st p{color:var(--dl-ink-2)}
.st .code{font-size:.74rem;color:var(--dl-danger);letter-spacing:.04em}
.st .sk{display:block;border-radius:3px;background:var(--dl-hair-2)}
@keyframes shimmer{0%{opacity:.45}50%{opacity:1}100%{opacity:.45}}
.st[data-kind=loading] .sk{animation:shimmer 1.4s ease-in-out infinite}
.st[data-kind=loading] .sk:nth-child(3n){animation-delay:.2s}
.st[data-kind=loading] .sk:nth-child(3n+1){animation-delay:.4s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.001s!important;scroll-behavior:auto!important}
}

.lnk{color:var(--dl-ink);text-decoration:underline;text-decoration-color:var(--dl-gold);text-underline-offset:3px;padding:0;text-align:left}
.lnk:hover{color:var(--dl-gold-ink)}


/* ====== 03 · Ledger — one long editorial scroll; rhythm and alignment, no table lines ====== */
body{background:linear-gradient(180deg,var(--dl-hi),var(--dl-canvas))}
.room{height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;--gut2:clamp(1rem,3.2vw,3rem);--mw:236px;--rw:60px;--erow:70px;--hrow:76px}
.sheet{margin:clamp(1.4rem,3.4vh,2rem) var(--gut2) clamp(.6rem,1.8vh,1.2rem);background:var(--dl-paper);border:1px solid var(--dl-hair);border-radius:16px;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden}

.head{display:grid;grid-template-columns:var(--mw) minmax(0,1fr) var(--rw);align-items:end;padding-top:clamp(1rem,2.6vh,1.7rem)}
.head .mh{padding:0 1.4rem 0 clamp(1.2rem,2vw,2rem)}
.head h1{font-family:var(--dl-display);font-weight:400;font-size:clamp(2rem,4.6vh,2.8rem);line-height:.98;letter-spacing:-.02em}
.head h1 small{display:block;margin-top:.55rem;font-family:var(--dl-sans);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dl-ink-2)}
.head .mc{padding:0 1.6rem 0 0}
.q{border-bottom:1px solid var(--dl-hair-strong);padding:.3rem 0}
.q:focus-within{border-color:var(--dl-gold-ink)}
.q input{font-family:var(--dl-display);font-size:1.5rem}
.q svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--dl-ink-3);stroke-width:1.6;stroke-linecap:round}
.views-row{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.2rem;padding:.7rem 0 .8rem;margin-left:-.7rem}
.views-row .add{margin-left:auto}
.views button{padding:.28rem .6rem}
.head .rr{align-self:stretch}

.body{position:relative;display:grid;grid-template-columns:var(--mw) minmax(0,1fr) var(--rw);min-height:0;border-top:1px solid var(--dl-hair)}
/* margin: the running head, like guide words at the top of a dictionary page */
.margin{position:relative;padding:1.4rem 1.4rem 0 clamp(1.2rem,2vw,2rem);min-height:0}
.rh{position:sticky;top:1.4rem}
.rh .p{font-family:var(--dl-display);font-size:clamp(1.9rem,4.4vh,2.6rem);line-height:1;letter-spacing:-.02em}
.rh .t{margin-top:.6rem;font-size:.74rem;color:var(--dl-ink-3);line-height:1.6}
.rh .fo{margin-top:1.6rem;font-family:var(--dl-display);font-size:1.05rem;color:var(--dl-gold-ink)}
.rh .fo i{font-style:normal;font-size:.8rem;color:var(--dl-ink-3)}
.rh .keys{margin-top:1.6rem;display:grid;gap:.45rem;font-size:.72rem;color:var(--dl-ink-3)}
.rh .keys span{display:flex;gap:.4rem;align-items:center}

.scroll{position:relative;overflow-y:auto;overflow-x:hidden;min-height:0;outline:none;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll:focus-visible{outline:2px solid var(--dl-gold-ink);outline-offset:-3px;border-radius:6px}
.host{position:relative;width:100%}
.ent,.grp{position:absolute;left:0;right:0;z-index:0}
.grp{display:flex;align-items:flex-end;gap:1rem;padding:0 calc(1.6rem + 6.6rem) .55rem 0}
.grp .l{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dl-gold-ink);white-space:nowrap}
.grp .r{flex:1;text-align:right;font-size:.74rem;color:var(--dl-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .r b{font-weight:500;color:var(--dl-ink-2)}
.grp .r .o{color:var(--dl-danger)}
.grp::after{content:"";position:absolute;left:0;right:1.6rem;bottom:0;height:1px;background:var(--dl-hair-strong)}
.ent{padding:.55rem calc(1.6rem + 6.6rem) .45rem 0;cursor:pointer;color:var(--dl-ink-2)}
.ent .l1{display:flex;align-items:baseline;gap:.5rem;min-width:0}
.ent .co{font-family:var(--dl-display);font-size:1.2rem;line-height:1.25;color:var(--dl-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.ent .lead{flex:1 1 1.5rem;min-width:1.5rem;align-self:flex-end;height:.82em;margin-bottom:.1em;border-bottom:1px dotted var(--dl-hair-strong)}
.ent .wh{font-size:.84rem;color:var(--dl-ink);white-space:nowrap}
.ent .wh i{font-style:normal;color:var(--dl-ink-3);margin-left:.5rem;font-size:.76rem}
.ent .l2{display:grid;grid-template-columns:190px minmax(0,1fr) 232px;gap:0 1.2rem;margin-top:.15rem;font-size:.78rem;line-height:1.45}
.ent .l2 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ent .l2 .nx{text-align:right}
.ent .l2 .nx em{font-style:normal;color:var(--dl-ink)}
.ent .l2 .nx.over em{color:var(--dl-danger)}
.ent .l2 .nx.none{font-family:var(--dl-display);font-style:italic;font-size:.9rem;color:var(--dl-ink-3)}
.ent .l2 .sn{color:var(--dl-ink-3)}
/* margin glyphs: selection and position live in the gutter, never in the text */
.ent .ck{position:absolute;left:-1.5rem;top:1rem;width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--dl-hair-strong);opacity:0;cursor:pointer;background:transparent}
.ent:hover .ck,.ent.cur .ck,body.has-sel .ent .ck{opacity:1}
.ent.sel .ck{background:var(--dl-ink);box-shadow:none;opacity:1}
.ent.sel .ck::after{content:"";position:absolute;left:4.5px;top:2px;width:4px;height:8px;border:solid var(--dl-paper);border-width:0 1.6px 1.6px 0;transform:rotate(40deg)}
/* the lit entry — full ink, a paper wash to the margin edge, gold tick = "you are here" */
.ent.cur{color:var(--dl-ink-2)}
.ent.cur .lit{position:absolute;left:-.7rem;right:.6rem;top:0;bottom:0;border-radius:10px;background:var(--dl-gold-wash);z-index:-1}
.ent.cur .tick{position:absolute;left:-1.5rem;top:0;bottom:0;width:0}
.ent .lit,.ent .tick{display:none}
.ent.cur .lit{display:block}
.ent.cur .sn{color:var(--dl-ink-2)}
.ent .opn{display:none;position:absolute;right:1.6rem;top:50%;transform:translateY(-50%);z-index:2}
.ent.cur .opn{display:inline-flex}
.ent.cur .l2 .nx,.ent.cur .wh{visibility:visible}
.dim .ent:not(.cur) .co{color:var(--dl-ink-2)}

/* ruler: every customer is a tick; drag to scrub the whole ledger */
.ruler{position:relative;border-left:1px solid var(--dl-hair-2);cursor:ns-resize;touch-action:none}
.ruler canvas{position:absolute;inset:0;width:100%;height:100%}
.lens{position:absolute;right:calc(var(--rw) - 8px);transform:translateY(-50%);padding:.35rem .7rem;border-radius:8px;background:var(--dl-paper);border:1px solid var(--dl-hair-strong);box-shadow:var(--dl-shadow-2);
  font-size:.78rem;white-space:nowrap;max-width:min(420px,60vw);overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transition:opacity .12s;z-index:5}
.lens.on{opacity:1}
.lens b{font-family:var(--dl-display);font-weight:400;font-size:1rem;margin-right:.5rem}
.lens i{font-style:normal;color:var(--dl-ink-3)}

.tray-slot{position:absolute;left:50%;bottom:1rem;transform:translateX(-50%);z-index:8}

/* --- four states, dressed as ledger --- */
.state{position:absolute;inset:0;display:none;z-index:3;padding:1.4rem 1.6rem 0 0;background:var(--dl-paper)}
.state.on{display:block}
.state h3{font-size:clamp(1.7rem,4vh,2.4rem);line-height:1.12;letter-spacing:-.015em;margin:.5rem 0 .6rem}
.state .acts{display:flex;align-items:center;gap:.8rem;margin-top:1.1rem;flex-wrap:wrap}
.state .hint{font-size:.74rem;color:var(--dl-ink-3)}
.state .st{max-width:560px;padding-top:.5rem}
.state em{font-style:italic;text-decoration:line-through;text-decoration-color:var(--dl-gold);text-decoration-thickness:1.5px}
/* empty: a blank ledger page, rules only. loading: placeholder lines with leaders. error: a struck-through band. none: the query, struck out. */
.state[data-kind=empty]{background:repeating-linear-gradient(to bottom,transparent 0,transparent 69px,var(--dl-hair-2) 69px,var(--dl-hair-2) 70px)}
.state[data-kind=empty] .st{background:var(--dl-paper);padding:1.4rem 1.6rem 1.6rem 0;margin-top:1.2rem}
.state[data-kind=loading] .st{max-width:none}
.state[data-kind=loading] h3{font-family:var(--dl-sans);font-size:.9rem;color:var(--dl-ink-2);margin:0 0 1.2rem}
.state[data-kind=loading] .micro{display:none}
.state[data-kind=loading] .sks{display:grid;gap:1.55rem}
.state[data-kind=loading] .sk{height:12px;width:58%;position:relative;background:none;border-bottom:1px dotted var(--dl-hair-strong);border-radius:0;height:14px}
.state[data-kind=loading] .sk::before{content:"";position:absolute;left:0;top:0;height:12px;width:34%;background:var(--dl-hair-2);border-radius:3px}
.state[data-kind=loading] .sk::after{content:"";position:absolute;right:0;top:2px;height:9px;width:9%;background:var(--dl-hair-2);border-radius:3px}
.state[data-kind=loading] .sk:nth-child(2n){width:72%}.state[data-kind=loading] .sk:nth-child(3n){width:50%}
.state[data-kind=error] .st{border-left:3px solid var(--dl-danger);padding:1rem 0 1rem 1.4rem;margin-top:1rem}
.state[data-kind=none] .st{padding-top:1.4rem}

.dock{display:none;align-items:center;gap:.8rem;padding:.55rem 1rem .7rem;border-top:1px solid var(--dl-hair-strong);background:var(--dl-paper)}
.dock .n{flex:1;min-width:0}
.dock .n b{display:block;font-family:var(--dl-display);font-weight:400;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .n span{font-size:.74rem;color:var(--dl-ink-3)}
@media (max-width:1180px){
  .ent .l2{grid-template-columns:150px minmax(0,1fr) 200px}
  .rh .keys{display:none}
}
@media (max-width:900px){
  .room{--mw:0px;--erow:96px;--hrow:64px;--rw:26px}
  .margin{display:none}
  .head{grid-template-columns:minmax(0,1fr) var(--rw)}
  .head .mh{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;padding:0 1rem}
  .head .mh small{display:none}
  .head .mc{padding:.5rem 0 0 1rem;grid-column:1}
  .body{grid-template-columns:minmax(0,1fr) var(--rw)}
  .body .scroll{grid-column:1}
  .body .ruler{grid-column:2}
  .sheet{margin:0;border-radius:0;border-left:0;border-right:0}
  .ent{padding:.6rem .8rem .5rem 1rem}
  .grp{padding:0 .8rem .5rem 1rem}
  .grp::after{left:1rem;right:.8rem}
  .ent .co{font-size:1.1rem}
  .ent .l2{grid-template-columns:minmax(0,1fr);gap:0;margin-top:.1rem}
  .ent .l2 .sn{display:none}
  .ent .l2 .nx{text-align:left;margin-top:.1rem}
  .ent .ck{display:none}
  .ent.cur .lit{left:.35rem;right:.35rem}
    .ent .opn{display:none!important}
  .dock{display:flex}
  .lens{right:calc(var(--rw) - 4px)}
  .views-row{overflow-x:auto;flex-wrap:nowrap;white-space:nowrap;padding:.5rem 1rem .6rem;margin:0;scrollbar-width:none}
  .views-row::-webkit-scrollbar{display:none}
  .views-row .views{flex-wrap:nowrap}
  .views-row .add{display:none}
  .state{padding-left:1rem}
  .state[data-kind=error] .st{margin-left:0}
}
@media (max-height:720px){.rh .keys{display:none}}
</style>
</head>
<body data-room="ledger">
<div class="room" id="room">
  <div class="sheet">
    <header class="head">
      <div class="mh"><h1>客户<small id="sub">台账 · 按最近发生</small></h1></div>
      <div class="mc">
        <label class="q" id="qbox"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
          <span class="sr">搜索客户</span>
          <input id="q" type="search" autocomplete="off" placeholder="公司、联系人、国家、行业、邮箱…" aria-label="搜索客户">
          <kbd>/</kbd><button class="clear" type="button">清除</button></label>
        <div class="views-row"><nav class="views" id="views"></nav><button class="ghost add" type="button" data-act="add">添加客户</button></div>
      </div>
      <div class="rr"></div>
    </header>
    <div class="body" id="body">
      <aside class="margin" aria-hidden="true">
        <div class="rh" id="rh"><div class="p" id="rhP">本周</div><div class="t" id="rhT"></div><div class="fo" id="rhF"></div>
          <div class="keys"><span><kbd>↑</kbd><kbd>↓</kbd> 逐条</span><span><kbd>↵</kbd> 打开</span><span><kbd>X</kbd> 选入 · <kbd>/</kbd> 搜索</span><span>拖右侧尺子速览</span></div></div>
      </aside>
      <div class="scroll" id="scroll" tabindex="0" role="listbox" aria-label="客户台账，上下方向键逐条，回车打开"><div class="host" id="host"></div>
        <div class="state" id="state"></div></div>
      <div class="ruler" id="ruler" aria-hidden="true"><canvas id="cv"></canvas><div class="lens" id="lens"></div></div>
      <div class="tray-slot" id="tray"></div>
    </div>
  </div>

<script>
/* Shared behaviour for the three customer-list rooms: data, views, search,
   states, selection, keyboard, time zones, fixed-size windowing.
   Everything is read-only; nothing here talks to a backend. */
(function () {
  'use strict';
  var TR = window.TR = {};
  var qs = new URLSearchParams(location.search);
  if (qs.has('embed')) document.body.classList.add('embed');
  TR.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  TR.ME_TZ = 'Asia/Shanghai';

  /* ---------------------------------------------------------------- data */
  var raw = JSON.parse(document.getElementById('tr-data').textContent);
  var stress = parseInt(qs.get('n') || '0', 10);
  if (stress > raw.length) {           // ?n=1500 — same rows, cloned, to feel the scale
    var out = raw.slice(), k = 1;
    while (out.length < stress) {
      raw.forEach(function (c, i) {
        if (out.length >= stress) return;
        var j = ((c.id * 7919 + k * 104729) % 97);
        var d = Object.assign({}, c, { id: c.id + k * 10000, company: c.company + ' · ' + (k + 1) });
        d.evt = Math.max(0, c.evt + (j % 23) - 8);
        if (d.next) d.due = c.due + (j % 9) - 4;
        out.push(d);
      });
      k++;
    }
    raw = out;
  }
  var data = raw;
  data.forEach(function (c) {
    c.overdue = !!c.next && c.due < 0;
    c.silent = c.hasContact && c.evt >= 30;
    c._s = norm([c.company, c.person, c.country, c.en || '', c.iso, c.city, c.field, c.web, c.email].join(' \n '));
  });
  TR.all = data;
  TR.byId = {};
  data.forEach(function (c) { TR.byId[c.id] = c; });

  function norm(s) { return String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, ''); }
  TR.norm = norm;
  TR.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; });
  };

  /* ---------------------------------------------------------------- dates */
  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var base = new Date(); base.setHours(0, 0, 0, 0);
  TR.dateOf = function (offsetDays) { return new Date(base.getFullYear(), base.getMonth(), base.getDate() + offsetDays); };
  TR.md = function (offsetDays) { var d = TR.dateOf(offsetDays); return (d.getMonth() + 1) + '/' + d.getDate(); };
  TR.rel = function (evt) {
    if (evt <= 0) return '今天';
    if (evt === 1) return '昨天';
    if (evt < 14) return evt + ' 天前';
    if (evt < 60) return Math.round(evt / 7) + ' 周前';
    if (evt < 365) return Math.round(evt / 30) + ' 个月前';
    return Math.floor(evt / 365) + ' 年前';
  };
  TR.lastText = function (c) { return TR.rel(c.evt); };
  TR.lastWhat = function (c) {
    return c.hasContact ? (c.waiting ? '等待回复' : '已有联系') : '未获回复';
  };
  TR.due = function (c) {   // -> {t: short text, full: with date, cls}
    if (!c.next) return { t: '尚无下一步', full: '尚无下一步', cls: 'none' };
    var d = c.due;
    if (d < 0) return { t: '逾期 ' + (-d) + ' 天', full: '逾期 ' + (-d) + ' 天 · ' + TR.md(d), cls: 'over' };
    if (d === 0) return { t: '今天', full: '今天', cls: 'soon' };
    if (d === 1) return { t: '明天', full: '明天 · ' + TR.md(d), cls: 'soon' };
    if (d < 7) return { t: WD[TR.dateOf(d).getDay()], full: WD[TR.dateOf(d).getDay()] + ' · ' + TR.md(d), cls: 'soon' };
    return { t: TR.md(d), full: TR.md(d), cls: 'later' };
  };
  TR.bucket = function (c) {   // guide-card buckets by "最近发生"
    var e = c.evt;
    if (e <= 7) return { id: 'w', label: '本周', order: 0 };
    if (e <= 30) return { id: 'm', label: '本月', order: 1 };
    if (e <= 90) return { id: 'q', label: '一至三个月', order: 2 };
    return { id: 'o', label: '更早', order: 3 };
  };

  /* ---------------------------------------------------------------- views */
  TR.views = [
    { id: 'all', label: '全部', test: function () { return true; } },
    { id: 'uncontacted', label: '未获回复', test: function (c) { return !c.hasContact; } },
    { id: 'communicated', label: '已有联系', test: function (c) { return c.hasContact; } },
    { id: 'waiting', label: '等待回复', test: function (c) { return c.waiting; } },
    { id: 'silent', label: '很久未联系', test: function (c) { return c.silent; } },
    { id: 'no_next', label: '尚无下一步', test: function (c) { return !c.next; } }
  ];
  TR.viewById = {}; TR.views.forEach(function (v) { TR.viewById[v.id] = v; });

  /* --------------------------------------------------------------- model */
  TR.view = 'all'; TR.q = ''; TR.state = 'loading'; TR.sel = new Set();
  var subs = [];
  TR.on = function (fn) { subs.push(fn); };
  TR.emit = function (why) { subs.forEach(function (fn) { fn(why); }); };

  var FIELDS = [['company', '公司'], ['person', '联系人'], ['country', '国家'], ['en', '国家'], ['city', '城市'], ['field', '行业'], ['web', '网站'], ['email', '邮箱'], ['iso', '国家代码']];
  function tokens() { return norm(TR.q).split(/\s+/).filter(Boolean); }
  TR.tokens = tokens;
  function matches(c, toks) { for (var i = 0; i < toks.length; i++) if (c._s.indexOf(toks[i]) < 0) return false; return true; }
  TR.reasons = function (c) {
    var toks = tokens(); if (!toks.length) return [];
    var out = [];
    FIELDS.forEach(function (f) {
      var v = norm(c[f[0]] || '');
      if (toks.some(function (t) { return v.indexOf(t) >= 0; })) out.push(f[1]);
    });
    return out;
  };
  TR.hl = function (text) {
    var toks = TR.q.trim().split(/\s+/).filter(Boolean);
    var s = TR.esc(text);
    if (!toks.length) return s;
    toks.forEach(function (t) {
      var re = new RegExp('(' + TR.esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      s = s.replace(re, '<mark class="hl">$1</mark>');
    });
    return s;
  };

  var memo = { key: '', list: [] };
  TR.list = function () {           // filtered + sorted by "最近发生"
    if (TR.state !== 'ok') return [];
    var key = TR.view + '|' + TR.q;
    if (memo.key === key) return memo.list;
    var toks = tokens(), v = TR.viewById[TR.view];
    var l = data.filter(function (c) { return v.test(c) && matches(c, toks); });
    l.sort(function (a, b) { return a.evt - b.evt || a.id - b.id; });
    memo = { key: key, list: l };
    return l;
  };
  TR.counts = function () {         // per-view counts under the current search
    var toks = tokens(), out = {};
    TR.views.forEach(function (v) { out[v.id] = 0; });
    if (TR.state !== 'ok') return out;
    data.forEach(function (c) {
      if (!matches(c, toks)) return;
      TR.views.forEach(function (v) { if (v.test(c)) out[v.id]++; });
    });
    return out;
  };
  TR.kind = function () {
    if (TR.state !== 'ok') return TR.state;
    return TR.list().length ? 'ok' : 'none';
  };
  TR.setView = function (id) { if (TR.view === id) return; TR.view = id; memo.key = ''; TR.emit('view'); };
  TR.setQuery = function (q) {
    q = q || '';
    if (q === TR.q) return;
    TR.q = q; memo.key = '';
    document.querySelectorAll('.q').forEach(function (b) {
      var i = b.querySelector('input'); if (i && i.value !== q) i.value = q;
      b.classList.toggle('has-text', !!q);
    });
    TR.emit('q');
  };
  TR.setState = function (s) {
    if (s === 'none') { TR.state = 'ok'; TR.view = 'all'; memo.key = ''; TR.setQuery('zzqx'); TR.emit('state'); return; }
    TR.state = s; memo.key = '';
    if (TR.q === 'zzqx') TR.setQuery('');
    TR.sel.clear(); document.body.classList.remove('has-sel');
    TR.emit('state');
  };
  TR.retry = function () {
    TR.setState('loading');
    setTimeout(function () { TR.setState('ok'); }, TR.reduce ? 0 : 650);
  };
  TR.clearSearch = function () { TR.view = 'all'; TR.setQuery(''); TR.emit('view'); };

  /* ----------------------------------------------------------- selection */
  TR.toggleSel = function (id) { if (TR.sel.has(id)) TR.sel.delete(id); else TR.sel.add(id); TR.selChanged(); };
  TR.rangeSel = function (ids, a, b) {
    var i = ids.indexOf(a), j = ids.indexOf(b); if (i < 0 || j < 0) return TR.toggleSel(b);
    for (var k = Math.min(i, j); k <= Math.max(i, j); k++) TR.sel.add(ids[k]);
    TR.selChanged();
  };
  TR.clearSel = function () { if (!TR.sel.size) return; TR.sel.clear(); TR.selChanged(); };
  TR.selChanged = function () { document.body.classList.toggle('has-sel', TR.sel.size > 0); TR.emit('sel'); };

  TR.mountTray = function (el) {
    el.classList.add('tray');
    el.setAttribute('role', 'region'); el.setAttribute('aria-label', '批量操作');
    el.innerHTML = '<span class="n" aria-live="polite"><b>0</b> 项已选</span>' +
      '<button class="solid" data-tray="export">导出邮箱</button>' +
      '<button class="ghost" data-tray="archive">归档</button>' +
      '<button class="ghost" data-tray="cancel">取消</button>';
    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-tray]'); if (!b) return;
      var n = TR.sel.size, a = b.dataset.tray;
      if (a === 'export') TR.say('已导出 ' + n + ' 个客户的邮箱（原型，未写入任何数据）');
      if (a === 'archive') TR.say('将归档 ' + n + ' 个客户（原型，未写入；真实实现会先生成可恢复快照）');
      TR.clearSel();
    });
    TR.on(function () {
      var n = TR.sel.size;
      el.classList.toggle('on', n > 0);
      el.querySelector('.n').innerHTML = '<b>' + n + '</b> 项已选';
    });
  };

  var liveTimer = 0;
  TR.say = function (msg) {
    var el = document.getElementById('live');
    if (!el) { el = document.createElement('div'); el.id = 'live'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite'); document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('on');
    clearTimeout(liveTimer); liveTimer = setTimeout(function () { el.classList.remove('on'); }, 2800);
  };
  var openSubs = [];
  TR.onOpen = function (fn) { openSubs.push(fn); };
  TR.open = function (c) {
    if (!c) return;
    TR.say('打开客户 · ' + c.company + '（原型不跳转，真实页面进入客户工作台）');
    openSubs.forEach(function (fn) { fn(c); });
  };

  /* --------------------------------------------------------------- states */
  TR.suggest = function (q) {
    var t = norm(q).trim().split(/\s+/)[0]; if (!t || t.length < 3) return null;
    function lev(a, b) {
      var m = a.length, n = b.length, d = [], i, j;
      for (i = 0; i <= m; i++) { d[i] = [i]; }
      for (j = 1; j <= n; j++) d[0][j] = j;
      for (i = 1; i <= m; i++) for (j = 1; j <= n; j++)
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      return d[m][n];
    }
    var best = null, bd = 3;
    data.forEach(function (c) {
      var w = norm(c.company).split(/\s+/)[0], dd = lev(t, w.slice(0, t.length + 1));
      if (dd < bd) { bd = dd; best = c; }
    });
    return best;
  };
  var SK = function (n, cls) { var s = ''; for (var i = 0; i < n; i++) s += '<i class="sk ' + (cls || '') + '"></i>'; return s; };

  }
  TR.bindKeys({
    focusList: function () { sc.focus({ preventScroll: true }); },
    key: function (e) {
      if (TR.kind() !== 'ok') return false;
      switch (e.key) {
        case 'ArrowDown': case 'j': step(1, e.shiftKey); return true;
        case 'ArrowUp': case 'k': step(-1, e.shiftKey); return true;
        case 'PageDown': step(Math.max(4, Math.floor(sc.clientHeight / cssPx('--erow', 70)) - 1)); return true;
        case 'PageUp': step(-Math.max(4, Math.floor(sc.clientHeight / cssPx('--erow', 70)) - 1)); return true;
        case 'Home': step(-1e9); return true;
        case 'End': step(1e9); return true;
        case 'Enter': TR.open(TR.byId[cur]); return true;
        case 'x': case 'X': case ' ': TR.toggleSel(cur); anchor = cur; return true;
      }
      return false;
    }
  });
  TR.on(refresh); TR.start();
})();
</script>
</body>
</html>
