<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trosa — 01 Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    /* ---- Concept 01 · Index — 编辑式目录 ---- */
    --paper:#F3F0EA;
    --paper-2:#EFEBE3;
    --ink:#1C1A16;
    --ink-soft:#43403A;
    --muted:#918B80;
    --line:rgba(28,26,22,.14);
    --line-2:rgba(28,26,22,.30);
    --clay:#9C6B57;
    --ease:cubic-bezier(.22,.61,.36,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --serif:"Fraunces", "Songti SC", Georgia, "Times New Roman", serif;
    --sans:"Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  ::selection{background:var(--clay);color:var(--paper)}

  /* ---------- Shell ---------- */
  .shell{
    position:fixed;inset:0;
    display:grid;
    grid-template-columns: minmax(0,26rem) 1fr;
  }
  /* rail */
  .rail{
    position:relative;
    padding:clamp(1.6rem,3.4vw,3.2rem);
    display:flex;flex-direction:column;justify-content:space-between;
    border-right:1px solid var(--line);
    min-width:0;
  }
  .brand{display:flex;align-items:baseline;gap:.7rem}
  .brand .word{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(1.6rem,2.4vw,2.05rem);
    letter-spacing:-.02em;
    line-height:1;
  }
  .brand .dot{
    width:.42rem;height:.42rem;border-radius:50%;
    background:var(--clay);
    transform:translateY(-.08em);
    transition:transform .6s var(--ease);
  }
  .brand:hover .dot{transform:translateY(-.08em) scale(1.5)}
  .brand .cap{
    font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;
    color:var(--muted);
  }

  .rail-mid{
    align-self:flex-start;
    max-width:22ch;
  }
  .rail-mid .eyebrow{
    font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);
    margin-bottom:1.1rem;
  }
  .rail-mid p{
    font-family:var(--serif);
    font-weight:300;
    font-size:clamp(1.05rem,1.5vw,1.3rem);
    line-height:1.5;
    color:var(--ink-soft);
    font-style:italic;
    letter-spacing:-.01em;
  }

  .rail-foot{display:flex;flex-direction:column;gap:.9rem}
  .progress{display:flex;align-items:center;gap:.75rem;color:var(--muted);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase}
  .progress .bars{display:flex;gap:.28rem}
  .progress .bars i{width:1.5rem;height:1px;background:var(--line-2);display:block}
  .progress .bars i:nth-child(-n+1){background:var(--clay)}
  .clock{font-variant-numeric:tabular-nums;font-size:.72rem;letter-spacing:.12em;color:var(--muted)}
  .kbd-hint{font-size:.66rem;letter-spacing:.04em;color:var(--muted);line-height:1.7}
  .kbd-hint kbd{
    font-family:var(--sans);font-size:.62rem;border:1px solid var(--line-2);
    border-radius:.25rem;padding:.05rem .34rem;color:var(--ink-soft);background:transparent;
  }

  /* ---------- Index (right) ---------- */
  .index{
    display:flex;flex-direction:column;min-width:0;
    padding:clamp(1.6rem,3.4vw,3.2rem) clamp(1.6rem,4vw,4.5rem);
  }
  .index-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
    padding-bottom:1.2rem;border-bottom:1px solid var(--line);
    font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);
  }
  .index-head b{font-weight:500;color:var(--ink-soft)}
  .list{list-style:none;flex:1;display:flex;flex-direction:column}
  .list li{flex:1;min-height:0;display:flex}

  .row{
    position:relative;flex:1;width:100%;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:clamp(1rem,2.4vw,2.4rem);
    padding:0 .4rem 0 0;
    background:transparent;border:0;border-bottom:1px solid var(--line);
    color:inherit;text-align:left;cursor:pointer;
    font:inherit;
    transition:background .45s var(--ease);
    outline:none;
  }
  .list li:last-child .row{border-bottom:0}
  .row .num{
    font-family:var(--sans);
    font-size:.7rem;font-weight:500;letter-spacing:.16em;
    color:var(--muted);font-variant-numeric:tabular-nums;
    width:2.2rem;
    transition:color .4s var(--ease);
  }
  .row .name{
    font-family:var(--serif);
    font-weight:340;
    font-size:clamp(2.1rem,6.4vw,4.6rem);
    letter-spacing:-.025em;
    line-height:.98;
    display:flex;align-items:baseline;gap:1rem;
    transition:transform .55s var(--ease-out), color .4s var(--ease);
    will-change:transform;
  }
  .row .tail{
    display:flex;align-items:center;gap:.7rem;
    font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);
    opacity:0;transform:translateX(-.5rem);
    transition:opacity .45s var(--ease), transform .55s var(--ease-out), color .4s;
  }
  .row .tail .arrow{
    font-size:1rem;letter-spacing:0;transform:translateX(-.4rem);
    transition:transform .55s var(--ease-out);
  }
  /* the animated ink rule that grows across the top edge on hover */
  .row::before{
    content:"";position:absolute;left:0;right:100%;top:-1px;height:1px;
    background:var(--ink);
    transition:right .6s var(--ease-out);
  }
  .row:hover,.row:focus-visible{background:linear-gradient(90deg, rgba(156,107,87,.07), rgba(156,107,87,0) 62%)}
  .row:hover::before,.row:focus-visible::before{right:0}
  .row:hover .num,.row:focus-visible .num{color:var(--clay)}
  .row:hover .name,.row:focus-visible .name{transform:translateX(.9rem)}
  .row:hover .tail,.row:focus-visible .tail{opacity:1;transform:none}
  .row:hover .tail .arrow,.row:focus-visible .tail .arrow{transform:none}
  .row:active .name{transform:translateX(.9rem) scale(.995)}
  .row:focus-visible{background:linear-gradient(90deg, rgba(156,107,87,.11), rgba(156,107,87,0) 62%)}
  .row:focus-visible::after{
    content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--clay);
    pointer-events:none;
  }
  .row.is-dimmed{opacity:.34;transition:opacity .5s var(--ease)}

  /* ---------- Enter transition ---------- */
  .veil{
    position:fixed;inset:0;background:var(--ink);
    transform:scaleY(0);transform-origin:bottom;
    z-index:40;pointer-events:none;
    transition:transform .62s var(--ease-out);
  }
  .veil.on{transform:scaleY(1)}

  /* ---------- Workspace placeholder ---------- */
  .workspace{
    position:fixed;inset:0;z-index:50;
    background:var(--paper);
    display:flex;flex-direction:column;
    padding:clamp(1.6rem,3.4vw,3.2rem);
    opacity:0;visibility:hidden;transform:scale(1.015);
    transition:opacity .5s var(--ease) .12s, transform .7s var(--ease-out) .12s, visibility 0s linear .7s;
  }
  .workspace.on{opacity:1;visibility:visible;transform:none;transition-delay:.18s, .18s, 0s}
  .ws-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  .ws-back{
    font:inherit;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;
    background:none;border:0;color:var(--muted);cursor:pointer;
    display:inline-flex;align-items:center;gap:.5rem;padding:.4rem 0;transition:color .3s;
  }
  .ws-back:hover{color:var(--ink)}
  .ws-back:focus-visible{outline:1px solid var(--clay);outline-offset:4px;color:var(--ink)}
  .ws-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.2rem}
  .ws-main .hello{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--clay)}
  .ws-main .who{
    font-family:var(--serif);font-weight:330;font-style:italic;
    font-size:clamp(3rem,11vw,8.5rem);line-height:.92;letter-spacing:-.03em;
  }
  .ws-nav{display:flex;flex-wrap:wrap;gap:1.6rem;margin-top:1.4rem}
  .ws-nav span{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:.35rem}

  /* ---------- Concept chrome ---------- */
  .tag{
    position:fixed;left:50%;bottom:.9rem;transform:translateX(-50%);
    z-index:60;display:flex;align-items:center;gap:.6rem;
    font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);
    background:color-mix(in srgb, var(--paper) 82%, transparent);
    backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:999px;padding:.34rem .9rem;
    transition:opacity .3s;
  }
  .tag b{color:var(--ink);font-weight:500}
  .hidden-chrome .tag{opacity:0;pointer-events:none}

  @media (max-width:820px){
    .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .rail{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;padding-bottom:1.1rem;gap:1rem;flex-wrap:wrap}
    .rail-mid{display:none}
    .rail-foot{flex-direction:row;align-items:center;gap:1rem;margin-left:auto}
    .kbd-hint{display:none}
    .index{padding-top:1.1rem}
    .row .name{font-size:clamp(1.9rem,9vw,2.8rem)}
    .row .tail{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.001s !important}
  }
</style>
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <span class="word">Trosa</span>
        <span class="dot" aria-hidden="true"></span>
      </div>

      <div class="rail-mid">
        <div class="eyebrow">Select account</div>
        <p>四个工作台，同一条时间线。<br/>选择身份，继续今天的工作。</p>
      </div>

      <div class="rail-foot">
        <div class="progress">
          <span>04 accounts</span>
          <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="clock" id="clock">—</div>
        <div class="kbd-hint"><kbd>↑</kbd><kbd>↓</kbd> 移动 &nbsp; <kbd>↵</kbd> 进入 &nbsp; <kbd>1</kbd>–<kbd>4</kbd> 直接选择</div>
      </div>
    </aside>

    <main class="index">
      <div class="index-head">
        <span><b>Trosa</b> — Workspace registry</span>
        <span>2026</span>
      </div>
      <ul class="list" id="list">
        <li><button class="row" data-name="Amy"  data-num="01"><span class="num">01</span><span class="name">Amy</span><span class="tail"><span class="arrow">→</span><span>Enter</span></span></button></li>
        <li><button class="row" data-name="Emma" data-num="02"><span class="num">02</span><span class="name">Emma</span><span class="tail"><span class="arrow">→</span><span>Enter</span></span></button></li>
        <li><button class="row" data-name="Hamid" data-num="03"><span class="num">03</span><span class="name">Hamid</span><span class="tail"><span class="arrow">→</span><span>Enter</span></span></button></li>
        <li><button class="row" data-name="Kelley" data-num="04"><span class="num">04</span><span class="name">Kelley</span><span class="tail"><span class="arrow">→</span><span>Enter</span></span></button></li>
      </ul>
    </main>
  </div>

  <div class="veil" id="veil" aria-hidden="true"></div>

  <section class="workspace" id="workspace" aria-hidden="true">
    <div class="ws-top">
      <span>Trosa</span>
      <button class="ws-back" id="back">← Switch account</button>
    </div>
    <div class="ws-main">
      <div class="hello">Workspace ready</div>
      <div class="who" id="wsName">Amy</div>
      <nav class="ws-nav"><span>Today</span><span>Inbox</span><span>Customers</span><span>Calendar</span></nav>
    </div>
  </section>

  <div class="tag"><b>01</b> · Index</div>

<script>
(function(){
  var rows = Array.prototype.slice.call(document.querySelectorAll('.row'));
  var workspace = document.getElementById('workspace');
  var wsName = document.getElementById('wsName');
  var veil = document.getElementById('veil');
  var back = document.getElementById('back');
  var current = 0;
  var entered = false;

  rows.forEach(function(r,i){
    r.addEventListener('mouseenter', function(){ current = i; });
    r.addEventListener('focus', function(){ current = i; });
    r.addEventListener('click', function(){ enter(i); });
  });

  function enter(i){
    if(entered) return;
    entered = true;
    rows[i].focus({preventScroll:true});
    rows.forEach(function(r,j){ r.classList.toggle('is-dimmed', j!==i); });
    veil.classList.add('on');
    setTimeout(function(){
      wsName.textContent = rows[i].dataset.name;
      workspace.classList.add('on');
      workspace.setAttribute('aria-hidden','false');
      back.focus({preventScroll:true});
    }, 340);
    setTimeout(function(){ veil.classList.remove('on'); }, 700);
  }

  function leave(){
    entered = false;
    workspace.classList.remove('on');
    workspace.setAttribute('aria-hidden','true');
    rows.forEach(function(r){ r.classList.remove('is-dimmed'); });
    var again = rows[current];
    setTimeout(function(){ again && again.focus({preventScroll:true}); }, 420);
  }
  back.addEventListener('click', leave);

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && entered){ leave(); return; }
    if(entered) return;
    if(e.key === 'ArrowDown'){ e.preventDefault(); current = (current+1)%rows.length; rows[current].focus(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); current = (current-1+rows.length)%rows.length; rows[current].focus(); }
    else if(e.key === 'Enter'){ if(document.activeElement && document.activeElement.classList.contains('row')){ e.preventDefault(); enter(current); } }
    else if(/^[1-4]$/.test(e.key)){ e.preventDefault(); enter(parseInt(e.key,10)-1); }
    else if(e.key === 'h' || e.key === 'H'){ document.body.classList.toggle('hidden-chrome'); }
  });

  function tick(){
    var d = new Date();
    document.getElementById('clock').textContent = d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}).toUpperCase() + '  ·  ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  }
  tick(); setInterval(tick, 30000);
})();
</script>
</body>
</html>
