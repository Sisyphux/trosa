<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trosa — Workspace 02 · Daylight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#E6DFD2; --wall-hi:#F4F0E7; --paper:#FFFDF7;
  --ink:#24221D; --ink-2:#57534A; --mut:#948E82; --faint:#B7B1A4;
  --gold:#BC9052; --gold-2:#D8B27C;
  --hair:rgba(36,34,29,.11); --hair-2:rgba(36,34,29,.06);
  --serif:"Newsreader",Georgia,"Songti SC",serif;
  --sans:"Inter","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --gut:clamp(1.6rem,4vw,3.4rem);
  --ease:cubic-bezier(.16,1,.3,1); --ease-out:cubic-bezier(.22,.85,.16,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-weight:400;background:var(--wall);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.tnum{font-variant-numeric:tabular-nums}
.micro{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;background:linear-gradient(180deg,var(--wall-hi) 0%,var(--wall) 60%,#D9D1C0 100%)}

/* ---------- top ---------- */
.top{position:relative;z-index:3;display:flex;align-items:center;gap:1.3rem;height:clamp(48px,5.8vh,60px);padding:0 var(--gut);border-bottom:1px solid var(--hair-2)}
.brand{font-family:var(--serif);font-weight:400;font-size:1rem;letter-spacing:.01em}
.top .meta{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.nav{margin-left:auto;display:flex;gap:1.15rem}
.nav button{font-size:.74rem;letter-spacing:.05em;color:var(--mut);padding:.2rem 0;border-bottom:1px solid transparent;transition:color .3s var(--ease),border-color .3s var(--ease)}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);border-color:var(--gold)}
.who{display:flex;align-items:center;gap:.5rem;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.who i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(188,144,82,.14)}

/* ---------- the room ---------- */
.room{position:relative;overflow:hidden}
.sunband{position:absolute;left:-4%;right:-4%;top:-6%;height:42%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,253,247,.95),rgba(255,253,247,0));filter:blur(2px)}
.pool{position:absolute;left:68%;top:45%;width:min(900px,64vw);height:min(640px,74vh);transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,252,1),rgba(255,253,246,.92) 34%,rgba(255,250,238,.45) 60%,rgba(255,250,238,0) 78%);
  filter:blur(12px);opacity:0;transition:opacity 1.8s var(--ease) .25s}
body.entered .pool{opacity:1}
.room .vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(92% 84% at 68% 45%,rgba(0,0,0,0) 30%,rgba(70,62,48,.16) 100%)}

.ident{position:absolute;left:var(--gut);top:clamp(1.6rem,4.4vh,3.2rem);max-width:34ch}
.ident h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.1rem,1.6vw,1.42rem);line-height:1.25;letter-spacing:-.008em}
.ident .lines{margin-top:.65rem;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);line-height:1.95}
.ident .lines b{font-weight:400;color:var(--mut)}

/* the focal: what the light is holding */
.lit{position:absolute;left:50%;top:44%;transform:translateY(-50%);width:min(640px,45vw)}
.lit .k{display:block;color:var(--gold);letter-spacing:.3em}
.lit h2{margin-top:.8rem;font-family:var(--serif);font-weight:400;font-size:clamp(1.5rem,2.75vw,2.4rem);line-height:1.14;letter-spacing:-.018em}
.lit .when{margin-top:.85rem;font-size:.7rem;letter-spacing:.16em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lit .acts{margin-top:1.6rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.lit .acts button{padding:.52rem 1.05rem;border-radius:999px;font-size:.73rem;letter-spacing:.05em;color:var(--ink-2);
  border:1px solid transparent;transition:color .3s var(--ease),background .3s var(--ease),border-color .3s var(--ease)}
.lit .acts button:hover{color:var(--ink);background:rgba(255,253,247,.9);border-color:var(--hair)}
.lit .acts button.primary{background:var(--ink);color:#F6F2E9;padding:.56rem 1.2rem}
.lit .acts button.primary:hover{background:#37342C;color:#FFFDF7;border-color:transparent}

/* the dim column of records */
.panel{position:absolute;left:var(--gut);top:38%;bottom:15%;width:min(430px,32vw);display:flex;flex-direction:column}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding-bottom:.6rem;border-bottom:1px solid var(--hair)}
.phead .micro:first-child{color:var(--ink-2)}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:4.4rem minmax(0,1fr);gap:1rem;align-items:start;
  flex:1 1 0;min-height:0;padding:.72rem .8rem .72rem .7rem;border-bottom:1px solid var(--hair-2);
  transition:background .55s var(--ease),box-shadow .55s var(--ease)}
.row .dt{font-family:var(--sans);font-size:.62rem;letter-spacing:.1em;color:rgba(36,34,29,.42);font-variant-numeric:tabular-nums;padding-top:.16rem;transition:color .55s var(--ease)}
.row .tx{font-size:.83rem;line-height:1.5;color:rgba(36,34,29,.66);transition:color .55s var(--ease)}
.row .rs{display:block;margin-top:.3rem;font-size:.62rem;letter-spacing:.06em;color:rgba(36,34,29,.34);transition:color .55s var(--ease)}
.row.lit{background:rgba(255,253,247,.92);box-shadow:0 0 0 1px rgba(188,144,82,.20)}
.row.lit .dt{color:var(--gold)}
.row.lit .tx{color:var(--ink)}
.row.lit .rs{color:var(--mut)}
.dlg{display:grid;grid-template-columns:6.4rem minmax(0,1fr);gap:0 1rem;padding-top:.2rem}
.dlg dt{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:.4rem 0}
.dlg dd{font-size:.82rem;color:var(--ink-2);padding:.4rem 0;border-bottom:1px solid var(--hair-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex:1 1 0;min-height:0;
  padding:.72rem .8rem .72rem .7rem;border-bottom:1px solid var(--hair-2);transition:background .55s var(--ease)}
.prow.lit{background:rgba(255,253,247,.92);box-shadow:0 0 0 1px rgba(188,144,82,.20)}
.prow b{font-weight:400;font-size:.88rem;color:var(--ink-2);transition:color .55s var(--ease)}
.prow.lit b{color:var(--ink)}
.prow .sm{display:block;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:.26rem}
.prow a{font-size:.68rem;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--hair);white-space:nowrap}
.prow time{font-size:.66rem;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.prow.done b{color:var(--faint);text-decoration:line-through}

.readouts{position:absolute;right:var(--gut);bottom:clamp(1.2rem,3.4vh,2.4rem);display:flex;gap:clamp(1.2rem,2.6vw,2.4rem);text-align:right}
.readouts div span{display:block;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.readouts div b{display:block;margin-top:.3rem;font-family:var(--serif);font-weight:400;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- bottom ---------- */
.bot{position:relative;z-index:3;display:flex;align-items:center;gap:1rem;height:clamp(48px,5.8vh,60px);
  padding:0 clamp(7rem,9vw,8.5rem) 0 var(--gut);border-top:1px solid var(--hair-2)}
.bot .waitv{font-family:var(--serif);font-size:.9rem;color:var(--ink-2)}
.bot .date{margin-left:auto;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-variant-numeric:tabular-nums}

body.js .fade{opacity:0}
body.entered .fade{opacity:1;transition:opacity 1.1s var(--ease)}
body.entered .ident{transition-delay:.55s}
body.entered .panel{transition-delay:.7s}
body.entered .lit{transition-delay:.85s}
body.entered .readouts{transition-delay:1s}
body.entered .bot{transition-delay:1.1s}

/* ---------- intro: daylight arrives ---------- */
.intro{position:fixed;inset:0;z-index:80;background:var(--wall)}
.intro.gone{opacity:0;pointer-events:none;transition:opacity .9s var(--ease)}
.ifields{position:absolute;inset:0;display:flex}
.ifield{position:relative;flex:1 1 0;min-width:0;background:var(--t);display:flex;align-items:flex-end;padding:0 clamp(1.2rem,2.4vw,2.2rem) clamp(2.4rem,5vw,3.6rem);transition:flex-grow .7s var(--ease-out),opacity .5s var(--ease)}
.ifield.active{flex-grow:2.4}
.ifield.drained{flex-grow:0;opacity:0}
.ifield .spine{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.95rem;letter-spacing:.34em;text-transform:uppercase;color:rgba(36,34,29,.6);white-space:nowrap}
.ifield.active .spine{opacity:0}
.ibrand{position:absolute;top:clamp(1rem,2.4vw,1.6rem);left:clamp(1.2rem,2.4vw,2.2rem);font-family:var(--serif);font-size:1rem;color:#24221D}
.veil{position:fixed;inset:0;z-index:81;opacity:0;pointer-events:none;background:var(--wall);transition:opacity .6s var(--ease),background-color 1.1s var(--ease)}
.veil.on{opacity:1}
.veil.washed{background:var(--wall)!important}
.veil .beam{position:absolute;left:-30%;top:-45%;width:78%;height:130%;opacity:0;transform:rotate(11deg) translateX(-8%);
  background:linear-gradient(100deg,rgba(255,254,249,.98),rgba(255,252,243,.55) 42%,rgba(255,252,243,0) 72%);
  filter:blur(30px);transition:opacity 1.5s var(--ease),transform 2.2s var(--ease-out)}
.veil.washed .beam{opacity:1;transform:rotate(11deg) translateX(16%)}
.veil .ign{position:absolute;left:58%;top:44%;width:min(1180px,94vw);height:min(860px,90vh);transform:translate(-50%,-50%) scale(.14);opacity:0;filter:blur(12px);
  background:radial-gradient(closest-side,rgba(255,254,250,.98),rgba(255,251,241,.6) 42%,rgba(255,250,238,0) 76%);
  transition:transform 1.7s var(--ease-out),opacity 1.3s var(--ease)}
.veil.washed .ign{transform:translate(-50%,-50%) scale(1);opacity:1}
.veil .vname{position:absolute;left:clamp(1.2rem,2.4vw,2.2rem);bottom:clamp(2.2rem,4.6vw,3.4rem);font-family:var(--serif);font-weight:400;
  font-size:clamp(1.5rem,4.2vw,2.8rem);line-height:1;color:#24221D;transition:opacity .6s var(--ease) .2s,transform .8s var(--ease-out)}
.veil.washed .vname{opacity:0;transform:translateY(-.5rem)}

.replay{position:fixed;z-index:50;bottom:1rem;right:1rem;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);
  border:1px solid var(--hair);background:color-mix(in srgb,var(--wall) 88%,transparent);border-radius:999px;padding:.42rem .9rem;opacity:0;transition:opacity .7s var(--ease) 1s}
body.entered .replay{opacity:1}

@media (max-width:1024px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .room{padding:2.2rem var(--gut) 1.4rem;overflow:hidden}
  .ident,.lit,.panel,.readouts{position:static;width:auto;max-width:none;transform:none}
  .lit{margin:3rem 0 0}
  .panel{margin-top:2.8rem}
  .panel .pbody{flex:none;display:block}
  .row,.prow{flex:none}
  .prow{padding-left:0;padding-right:0}
  .row{padding-left:.35rem;padding-right:.35rem}
  .readouts{display:flex;text-align:left;margin-top:2.4rem}
  .pool{left:50%;top:26%;width:150vw;height:78vh;opacity:.9}
  .room .vig{display:none}
  .nav{display:none}
  .bot{flex-wrap:wrap;height:auto;gap:.6rem;padding:1rem var(--gut) 3.4rem}
  .bot .date{margin-left:0;width:100%}
}
@media (max-width:560px){
  .ident h1{font-size:1.05rem}
  .lit h2{font-size:1.45rem}
  .dlg{grid-template-columns:5.2rem minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
  body.js .fade{opacity:1!important}
  body.js .pool{opacity:1!important}
}
</style>
</head>
<body class="js">
<div class="intro" id="intro" aria-hidden="true">
  <div class="ifields" id="ifields">
    <div class="ifield" data-name="Amy" style="--t:#D9D0C3"><span class="spine">Amy</span></div>
    <div class="ifield" data-name="Emma" style="--t:#CCB7AB"><span class="spine">Emma</span></div>
    <div class="ifield" data-name="Hamid" style="--t:#BEC6B8"><span class="spine">Hamid</span></div>
    <div class="ifield" data-name="Kelley" style="--t:#BCC3C8"><span class="spine">Kelley</span></div>
  </div>
  <div class="ibrand">Trosa</div>
  <div class="veil" id="veil">
    <span class="beam"></span>
    <span class="ign"></span>
    <span class="vname" id="vname">Amy</span>
  </div>
</div>

<div class="app" id="app">
  <header class="top">
    <span class="brand">Trosa</span>
    <span class="meta tnum">客户工作台 / № 014</span>
    <nav class="nav" id="nav" aria-label="分区">
      <button data-v="timeline" class="on">最近沟通</button>
      <button data-v="profile">资料</button>
      <button data-v="contacts">联系人</button>
      <button data-v="files">文件</button>
      <button data-v="tasks">待办</button>
    </nav>
    <span class="who"><i></i><span id="whoUser">Amy</span></span>
  </header>

  <main class="room" id="room">
    <span class="sunband" aria-hidden="true"></span>
    <span class="pool" id="pool" aria-hidden="true"></span>

    <div class="ident fade">
      <h1>Acryl Innovations GmbH</h1>
      <p class="lines"><b>德国 · 展示器材 / 亚克力 · B+</b><br>SIGN CHINA 2026 · 展会 · acryl-innovations.de</p>
    </div>

    <section class="panel fade">
      <div class="phead"><span class="micro" id="pTitle">最近沟通</span><span class="micro tnum" id="pMeta">5 条记录</span></div>
      <div class="pbody" id="pBody"></div>
    </section>

    <section class="lit fade" id="lit">
      <span class="k micro">下一步</span>
      <h2>确认样品反馈，准备下一轮报价</h2>
      <p class="when">9 月 29 日 · 周二 · 2 天后</p>
      <div class="acts">
        <button class="primary" id="logBtn">记录沟通</button>
        <button>调整</button>
        <button>标记完成</button>
      </div>
    </section>

    <div class="readouts fade">
      <div><span>沟通记录</span><b>5</b></div>
      <div><span>未完成待办</span><b>2</b></div>
      <div><span>客户文件</span><b>3</b></div>
      <div><span>联系人</span><b>2</b></div>
    </div>
    <span class="vig" aria-hidden="true"></span>
  </main>

  <footer class="bot fade">
    <span class="micro">当前等待</span>
    <span class="waitv">客户内部确认再生料比例</span>
    <span class="date">今天 2026-09-27 · 周日 · 上次沟通 3 天前</span>
  </footer>
</div>

<button class="replay" id="replay">重播转场</button>

<script>
document.documentElement.classList.add('js');document.body.classList.add('js');

var DATA={customer:{
  company:'Acryl Innovations GmbH',no:'014',country:'德国',industry:'展示器材 / 亚克力',
  source:'SIGN CHINA 2026 · 展会',level:'B+',website:'acryl-innovations.de',businessRole:'终端',
  profile:'杜塞尔多夫零售陈列供应商，为连锁品牌定制亚克力陈列件。在测试我们的再生料系列，关注再生比例与欧盟合规文件。',
  waiting:'客户内部确认再生料比例',
  next:{title:'确认样品反馈，准备下一轮报价',date:'2026-09-29'},
  contacts:[{name:'Markus Weber',title:'采购经理',email:'m.weber@acryl-innovations.de',primary:true},
            {name:'Lena Fischer',title:'产品与合规',email:'l.fischer@acryl-innovations.de'}],
  facts:[
    {date:'2026-09-24',type:'邮件',dir:'in',source:'客户来信',full:'Markus 回复：三款色板的耐候测试通过，但需要我们在报价中标注再生料比例与 EU 合规编号。',result:'需补充材料说明'},
    {date:'2026-09-22',type:'寄样',dir:'out',source:'我方寄样',full:'寄出 R-PMMA 三款色板（自然、烟灰、琥珀）及基础参数表。'},
    {date:'2026-09-18',type:'展会现场',dir:'two',source:'SIGN CHINA 2026',full:'展位沟通 25 分钟，对方对再生亚克力系列感兴趣，现场索要样品与 MOQ。',result:'约定寄样并报价'},
    {date:'2026-09-16',type:'报价',dir:'out',source:'首轮报价 RP-0916',full:'发出首轮报价，MOQ 500 件，交期 25 天。'},
    {date:'2026-09-10',type:'开发邮件',dir:'out',source:'开发信',full:'通过领英找到采购负责人，发出首封开发邮件。'}
  ],
  files:[{name:'报价单_RP-0916.pdf',cat:'报价单',size:'218 KB',date:'2026-09-16'},
         {name:'色板参数表_R-PMMA.xlsx',cat:'产品资料',size:'64 KB',date:'2026-09-22'},
         {name:'SIGN_CHINA_展位记录.jpg',cat:'展会资料',size:'1.2 MB',date:'2026-09-18'}],
  tasks:[{title:'确认样品反馈，准备下一轮报价',date:'2026-09-29',done:false,next:true},
         {title:'补发 EU 合规文件（REACH / ROHS）',date:'2026-10-02',done:false},
         {title:'寄出手感样并确认收货',date:'2026-09-22',done:true}]
}};
function cn(iso){var p=iso.split('-');return Number(p[1])+' 月 '+Number(p[2])+' 日';}
function md(iso){var p=iso.split('-');return p[1]+'/'+p[2];}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function dirLabel(d){return {in:'客户发来',out:'我方发出',two:'双方沟通'}[d];}

/* ---------- the light: it follows attention ---------- */
var pool=document.getElementById('pool'),room=document.getElementById('room');
var REST={x:.68,y:.45},tgt={x:REST.x,y:REST.y},cur={x:REST.x,y:REST.y},raf=0;
function mobile(){return innerWidth<1024;}
function place(){pool.style.left=(cur.x*100)+'%';pool.style.top=(cur.y*100)+'%';}
function tick(){
  cur.x+=(tgt.x-cur.x)*.055;cur.y+=(tgt.y-cur.y)*.055;place();
  if(Math.abs(tgt.x-cur.x)>.0015||Math.abs(tgt.y-cur.y)>.0015){raf=requestAnimationFrame(tick);}
  else{raf=0;cur.x=tgt.x;cur.y=tgt.y;place();}
}
function go(nx,ny){tgt.x=Math.max(.06,Math.min(.94,nx));tgt.y=Math.max(.08,Math.min(.92,ny));if(!raf)raf=requestAnimationFrame(tick);}
room.addEventListener('mousemove',function(e){
  if(mobile())return;
  var r=room.getBoundingClientRect();
  go((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
});
room.addEventListener('mouseleave',function(){if(!mobile())go(REST.x,REST.y);});
function bindRows(){
  document.querySelectorAll('#pBody .row, #pBody .prow').forEach(function(el){
    if(el.dataset.bound)return;el.dataset.bound='1';
    el.addEventListener('mouseenter',function(){
      el.classList.add('lit');
      if(mobile())return;
      var r=el.getBoundingClientRect(),rr=room.getBoundingClientRect();
      go((r.left-rr.left+r.width*.3)/rr.width,(r.top-rr.top+r.height*.5)/rr.height);
    });
    el.addEventListener('mouseleave',function(){el.classList.remove('lit');if(!mobile())go(REST.x,REST.y);});
  });
}
place();

/* ---------- sections ---------- */
var PANEL={
  timeline:{t:'最近沟通',render:function(c){return {meta:c.facts.length+' 条记录',html:c.facts.map(function(f){
    return '<div class="row"><span class="dt tnum">'+md(f.date)+'</span><div><p class="tx">'+esc(f.full)+'</p>'+
           '<span class="rs">'+esc(f.type)+' · '+(f.result?'结果 — '+esc(f.result):esc(dirLabel(f.dir)))+'</span></div></div>';
  }).join('')};}},
  profile:{t:'资料',render:function(c){return {meta:'客户身份',html:'<dl class="dlg">'+
    [['公司',esc(c.company)],['国家 / 地区',esc(c.country)],['行业领域',esc(c.industry)],['客户来源',esc(c.source)],
     ['等级 · 角色',esc(c.level)+' · '+esc(c.businessRole)],['网站','<a href="https://'+esc(c.website)+'" target="_blank" rel="noopener">'+esc(c.website)+'</a>'],
     ['当前等待',esc(c.waiting)],['简介',esc(c.profile)]].map(function(r){return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>';}).join('')+'</dl>'};}},
  contacts:{t:'联系人',render:function(c){return {meta:c.contacts.length+' 位',html:c.contacts.map(function(p){
    return '<div class="prow"><div><b>'+esc(p.name)+'</b><span class="sm">'+esc(p.title)+(p.primary?' · 主要联系人':'')+'</span></div>'+
           '<a href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a></div>';}).join('')};}},
  files:{t:'文件',render:function(c){return {meta:c.files.length+' 个',html:c.files.map(function(f){
    return '<div class="prow"><div><b>'+esc(f.name)+'</b><span class="sm">'+esc(f.cat)+' · '+esc(f.size)+'</span></div><time>'+md(f.date)+'</time></div>';}).join('')};}},
  tasks:{t:'待办',render:function(c){return {meta:c.tasks.filter(function(t){return !t.done;}).length+' 未完成',html:c.tasks.map(function(t){
    return '<div class="prow'+(t.done?' done':'')+'"><div><b>'+esc(t.title)+'</b><span class="sm">'+cn(t.date)+(t.next?' · 下一步':'')+'</span></div></div>';}).join('')};}}
};
function show(key){
  var c=DATA.customer,p=PANEL[key],d=p.render(c);
  document.getElementById('pTitle').textContent=p.t;
  document.getElementById('pMeta').textContent=d.meta;
  document.getElementById('pBody').innerHTML=d.html;
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===key);});
  bindRows();
  if(!mobile())go(REST.x,REST.y);
}
document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.dataset.v);});
document.getElementById('logBtn').addEventListener('click',function(){show('timeline');});
document.addEventListener('keydown',function(e){var m={'1':'timeline','2':'profile','3':'contacts','4':'files','5':'tasks','0':'timeline'};if(m[e.key])show(m[e.key]);});
show('timeline');

/* intro: daylight arrives — the field bleaches, a beam sweeps in, the light settles */
(function(){
  var intro=document.getElementById('intro'),veil=document.getElementById('veil'),vname=document.getElementById('vname');
  var ifields=[].slice.call(document.querySelectorAll('.ifield'));
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var timers=[];function tm(fn,ms){timers.push(setTimeout(fn,ms));}function clr(){timers.forEach(clearTimeout);timers=[];}
  function pick(el){ifields.forEach(function(f){f.classList.toggle('active',f===el);});}
  function tone(el){return el.getAttribute('style').replace(/^.*--t:/,'').replace(/;?$/,'');}
  function play(name,el){
    clr();document.body.classList.remove('entered');
    intro.classList.remove('gone');veil.classList.remove('on','washed');
    ifields.forEach(function(f){f.style.display='';f.classList.remove('active','drained');});
    veil.style.backgroundColor=tone(el);
    vname.textContent=name;document.getElementById('whoUser').textContent=name;
    if(reduce){enter(name);return;}
    pick(el);
    tm(function(){
      ifields.forEach(function(f){if(f!==el)f.classList.add('drained');});
      veil.classList.add('on');
      tm(function(){veil.classList.add('washed');},540);
      tm(function(){document.body.classList.add('entered');},540+1250);
      tm(function(){intro.classList.add('gone');},540+1250+800);
    },300);
  }
  function enter(name){
    clr();veil.classList.remove('on');ifields.forEach(function(f){f.style.display='none';});
    document.getElementById('whoUser').textContent=name;
    document.body.classList.add('entered');intro.classList.add('gone');
  }
  var chosen=0,interacted=false;
  ifields.forEach(function(f,i){
    f.addEventListener('mouseenter',function(){interacted=true;pick(f);});
    f.addEventListener('focus',function(){interacted=true;pick(f);});
    f.addEventListener('click',function(){interacted=true;chosen=i;play(f.dataset.name,f);});
  });
  setTimeout(function(){if(!interacted){chosen=0;play('Amy',ifields[0]);}},900);
  document.getElementById('replay').addEventListener('click',function(){intro.classList.remove('gone');play(ifields[chosen].dataset.name,ifields[chosen]);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!intro.classList.contains('gone')){enter('Amy');}});
})();
</script>
